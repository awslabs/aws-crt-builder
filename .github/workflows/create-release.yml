name: Create Release

# Make new images for every published release
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  CRT_CI_ROLE: ${{ secrets.CRT_CI_ROLE_ARN }}
  AWS_DEFAULT_REGION: us-east-1

permissions:
  id-token: write # This is required for requesting the JWT

jobs:
  package:
    name: Package builder app
    runs-on: ubuntu-24.04

    steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Get release tag
      uses: ./.github/actions/release-tag
      id: tag

    # re-enable this when requirements.txt has actual dependencies
    # - name: Bundle dependencies
    #   run: |
    #     python3 -m pip install -r requirements.txt --target builder
    #     rm -rf builder/*.dist-info

    - name: Package builder to S3
      run: |
        mkdir -p build
        mkdir -p staging
        cp -r builder staging/.
        python3 -m zipapp --python="/usr/bin/env python3" -m "builder.main:main" --output=build/builder staging
        aws s3 cp build/builder s3://$AWS_S3_BUCKET/releases/${{ steps.tag.outputs.release_tag }}/builder.pyz
        aws s3 cp build/builder s3://$AWS_S3_BUCKET/releases/latest/builder.pyz

    - name: Artifact builder
      uses: actions/upload-artifact@v4
      with:
        name: builder
        path: build/builder

  export-linux-images:
    # Release build: push :latest and export tarballs to S3.
    uses: ./.github/workflows/build-images.yml
    with:
      publish-latest: true
      export-to-s3: true
    secrets: inherit

  upload-ci-script:
    name: Upload container ci script
    runs-on: ubuntu-24.04

    steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Get release tag
      uses: ./.github/actions/release-tag
      id: tag

    - name: Upload script
      run: |
        aws s3 cp ./.github/workflows/linux-container-ci.sh s3://aws-crt-test-stuff/ci/${{ steps.tag.outputs.release_tag }}/linux-container-ci.sh
        aws s3 cp ./.github/workflows/linux-container-ci.sh s3://aws-crt-test-stuff/ci/latest/linux-container-ci.sh
