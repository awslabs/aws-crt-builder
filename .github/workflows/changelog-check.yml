# The pull request gate: assert the title follows the convention and that a
# customer-visible change carries exactly its own changelog fragment.
#
# A consumer repository holds only the trigger that calls this:
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     check:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: awslabs/aws-crt-builder/.github/workflows/changelog-check.yml@main
#
# `pull-requests: write` is optional: it lets an author who forgot a fragment be
# commented the template rather than having to find it in the run summary. This
# workflow declares no permissions of its own, because a called workflow cannot
# ask for more than its caller was granted -- doing so rejects the call outright.

name: Changelog Check

on:
  workflow_call:
    inputs:
      builder-ref:
        description: >-
          Ref of this repository supplying the action and the replay script. Pin
          it to whatever ref the caller pinned this workflow to.
        required: false
        type: string
        default: 'main'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The ref cannot be derived: `github.job_workflow_sha` is empty inside a
      # called workflow, and `workflow_ref` describes the caller.
      - uses: actions/checkout@v4
        with:
          repository: awslabs/aws-crt-builder
          ref: ${{ inputs.builder-ref }}
          path: .crt-builder

      - name: Collect the changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The action reads `status<TAB>path`, spelling each status the way the
          # pull request files API does rather than as git's single letter.
          git diff --name-status "$BASE_SHA...$HEAD_SHA" | awk -F'\t' 'BEGIN{OFS="\t"} {s=substr($1,1,1); n="changed"; if(s=="A")n="added"; else if(s=="M")n="modified"; else if(s=="D")n="removed"; else if(s=="R")n="renamed"; print n,$NF}' > changed-paths.tsv
          cat changed-paths.tsv

      - name: Assert the title convention and the fragment
        id: changelog
        uses: ./.crt-builder/.github/actions/changelog
        with:
          mode: check
          pr: ${{ github.event.pull_request.number }}
          title: ${{ github.event.pull_request.title }}
          changed-paths-file: changed-paths.tsv
          # A bot cannot be asked to retitle its own pull request, so both the
          # title convention and the fragment are waived for one.
          bot-author: ${{ github.event.pull_request.user.type == 'Bot' && github.event.pull_request.user.login || '' }}

      # An author who does not know the convention gets the fragment written for
      # them. Every other failure only earns the diagnostic the check printed.
      - name: Seed a fragment template
        if: steps.changelog.outputs.reason == 'missing-fragment'
        uses: ./.crt-builder/.github/actions/changelog
        with:
          mode: seed
          pr: ${{ github.event.pull_request.number }}
          title: ${{ github.event.pull_request.title }}
          # Outside .changes/, so the template is a starting point rather than a
          # fragment this pull request has committed.
          out: fragment-template.json

      - name: Offer the template to the author
        if: steps.changelog.outputs.reason == 'missing-fragment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FRAGMENT: .changes/preview/${{ github.event.pull_request.number }}.json
          MARKER: '<!-- changelog-fragment-template -->'
        run: |
          set -euo pipefail
          { echo "$MARKER"
            echo "Commit this as \`${FRAGMENT}\`:"
            echo
            echo '```json'
            cat fragment-template.json
            echo '```'
          } > comment.md
          # The job summary always works. A comment needs a writable token, which
          # a pull request raised from a fork does not get however this workflow
          # asks -- so the summary is the guarantee and the comment is a bonus.
          cat comment.md >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          cat comment.md
          # The marker keeps a re-push from stacking another identical comment.
          if gh pr view "$PR" --repo "$REPO" --json comments \
               -q '.comments[].body' 2>/dev/null | grep -qF "$MARKER"; then
            echo "the template has already been commented"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file comment.md \
              || echo "::notice::Could not comment (a pull request from a fork gets a read-only token); the template is in this run's summary."
          fi

      - name: Gate on the result
        env:
          RC: ${{ steps.changelog.outputs.rc }}
          REASON: ${{ steps.changelog.outputs.reason }}
        run: |
          set -euo pipefail
          echo "rc=${RC} reason=${REASON}"
          # The action reports and does not fail, so the gate lives here.
          [[ "${RC}" == "0" ]]
