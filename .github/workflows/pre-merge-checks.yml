# Everything that must be true before a pull request merges, in one workflow.
#
# Internal and external pull requests take the same path. The only difference is
# that an external one waits for a maintainer to add the approval label before the
# credentialed jobs start, and a push removes the label again.
#
# How it runs. GitHub schedules jobs as a graph: a job with no `needs` starts at
# once, and a job waits only for the jobs it names. So declare real dependencies and
# nothing more, and everything independent runs in parallel.
#
#   plan        decides what this event runs (a few seconds)
#   abi         credentialed; needs plan
#   changelog   no credentials; needs only plan
#   verdict     needs every check, is the only job that writes labels, and posts the
#               `pre-merge/gate` commit status the ruleset requires
#
# Adding a check:
#   1. Add a job with `needs: plan`, so an event that changes nothing skips it. A
#      credentialed one also adds `if: ${{ needs.plan.outputs.run_credentialed == 'true' }}`.
#      A check that builds on another adds that job to its own `needs`.
#   2. Add its name to `verdict.needs`. The verdict fails if any needed job failed or
#      was cancelled; a check that needs more than pass/fail exposes outputs for it.
#
# The caller's repository needs the labels `patch`, `minor` and `needs-review` (created on
# first use) and, when the gate is on, the approval label (created by the verdict).
#
# Caller (pull_request_target runs from the default branch, so keep it thin). The
# concurrency group is per event kind on purpose: a run keeps its slot even when every job
# is skipped, and a newer pending run in the same group replaces an older one. One group
# per PR would let an unrelated label evict a pending push or verdict-label run; per kind,
# only a newer event of the same kind can, and that one supersedes it.
#
#   on:
#     pull_request_target:
#       types: [opened, reopened, synchronize, edited, labeled, unlabeled]
#   concurrency:
#     group: pre-merge-${{ github.event.pull_request.number }}-${{ github.event.action }}-${{ github.event.label.name }}
#   jobs:
#     pre-merge:
#       permissions:
#         contents: read
#         pull-requests: write
#         id-token: write
#         statuses: write
#       uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@main
#       with:
#         lib-name: aws-c-common
#         approval-label: ci-ready
#       secrets:
#         CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}
name: Pre-merge checks

on:
  workflow_call:
    inputs:
      lib-name:
        description: 'C library name for the ABI check, e.g. aws-c-common.'
        required: true
        type: string
      approval-label:
        description: >-
          Label a maintainer adds to let a fork pull request run the credentialed
          checks. A push removes it. Required for fork pull requests: with '' they never
          run the credentialed checks.
        required: false
        type: string
        default: ''
      gate-same-repo:
        description: 'Apply the approval label to same-repo pull requests too (for testing the gate).'
        required: false
        type: boolean
        default: false
      abi-image-registry:
        description: 'ECR registry holding the aws-crt-ubuntu-22-abi-x64 image the ABI check runs in.'
        required: false
        type: string
        default: '123124136734.dkr.ecr.us-east-1.amazonaws.com'
      runs-on:
        required: false
        type: string
        default: 'ubuntu-24.04'
    secrets:
      CRT_CI_ROLE_ARN:
        required: false

jobs:
  # Decides what this event runs. Every other job needs it, so this `if` is the one
  # place that drops events that change nothing: an edit that touches neither the title
  # nor the base, and a label event for any label but the approval label and the verdict
  # labels. Both adding and removing those labels re-evaluates the gate, so the status
  # never goes stale whichever order a maintainer does a swap in.
  # The ABI check runs on a code change, or for a gated pull request when its approval
  # label is added; a retitle or a label swap never recomputes it, so an override stands.
  plan:
    if: ${{ !((github.event.action == 'edited' && github.event.changes.title == null && github.event.changes.base == null) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && !(contains(fromJSON('["patch","minor","needs-review"]'), github.event.label.name) || (inputs.approval-label != '' && github.event.label.name == inputs.approval-label)))) }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      gated: ${{ steps.p.outputs.gated }}
      code_changed: ${{ steps.p.outputs.code_changed }}
      run_credentialed: ${{ steps.p.outputs.run_credentialed }}
    steps:
      - name: Plan
        id: p
        env:
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          APPROVAL_LABEL: ${{ inputs.approval-label }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          GATE_SAME_REPO: ${{ inputs.gate-same-repo }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        run: |
          set -euo pipefail
          CODE=false
          case "$ACTION" in
            opened|reopened|synchronize) CODE=true ;;
            edited) [[ "$BASE_CHANGED" == "true" ]] && CODE=true ;;
          esac
          # A fork's code never gets credentials unless a maintainer approves it, so with no
          # approval label configured it never runs the credentialed jobs at all.
          GATED=false
          [[ "$FORK" == "true" || "$GATE_SAME_REPO" == "true" ]] && GATED=true
          RUN=false
          if [[ "$GATED" == "true" ]]; then
            [[ -n "$APPROVAL_LABEL" && "$ACTION" == "labeled" && "${LABEL_NAME,,}" == "${APPROVAL_LABEL,,}" ]] && RUN=true
          else
            RUN=$CODE
          fi
          { echo "gated=$GATED"; echo "code_changed=$CODE"; echo "run_credentialed=$RUN"; } >> "$GITHUB_OUTPUT"

  # Credentialed, and builds the PR's code.
  abi:
    needs: plan
    if: ${{ needs.plan.outputs.run_credentialed == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.check.outputs.label }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CRT_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Resolve the commits to compare
        id: refs
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # fetch-depth 0 already brought every branch of the base repository.
          git rev-parse --verify --quiet "origin/${BASE_BRANCH}" > /dev/null \
            || { echo "::error::origin/${BASE_BRANCH} is missing from the checkout"; exit 1; }
          echo "base-sha=$(git merge-base HEAD "origin/${BASE_BRANCH}")" >> "$GITHUB_OUTPUT"

      - name: Check ABI
        id: check
        uses: awslabs/aws-crt-builder/.github/actions/check-abi@main
        with:
          lib-name: ${{ inputs.lib-name }}
          builder-version: latest
          base-ref: ${{ steps.refs.outputs.base-sha }}
          image-registry: ${{ inputs.abi-image-registry }}

  # No credentials and no PR code: it reads the fragment and the changed paths
  # through the API. It waits only for `plan` (seconds), well inside the ABI check.
  changelog:
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Read the fragment and changed paths at the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/changes/preview"
          FRAG="${RUNNER_TEMP}/changes/preview/${PR}.json"
          # Only a 404 means "no fragment"; any other API error fails the job instead of
          # being reported to the author as a missing fragment.
          fetch() { gh api "repos/${GITHUB_REPOSITORY}/contents/.changes/preview/${PR}.json?ref=$1" \
                      -H 'Accept: application/vnd.github.raw' > "$FRAG" 2> "${RUNNER_TEMP}/fetch.err"; }
          if ! fetch "${HEAD_SHA}"; then
            if grep -q 'HTTP 404' "${RUNNER_TEMP}/fetch.err"; then
              # A fork's commit may not resolve by sha in the base repository: try the PR ref.
              if ! fetch "refs/pull/${PR}/head"; then
                grep -q 'HTTP 404' "${RUNNER_TEMP}/fetch.err" || { cat "${RUNNER_TEMP}/fetch.err" >&2; exit 1; }
                rm -f "$FRAG"
              fi
            else
              cat "${RUNNER_TEMP}/fetch.err" >&2; exit 1
            fi
          fi
          # @tsv escapes tabs and newlines in a path, so one cannot forge another row.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" \
            --jq '.[] | (select(.filename | startswith(".changes/")) | [.status, .filename]), (select((.previous_filename // "") | startswith(".changes/")) | ["removed", .previous_filename]) | @tsv' \
            > "${RUNNER_TEMP}/changed-paths.tsv"

      - name: Check the PR title and the fragment
        uses: awslabs/aws-crt-builder/.github/actions/changelog@main
        with:
          mode: check
          changes-dir: ${{ runner.temp }}/changes
          changed-paths-file: ${{ runner.temp }}/changed-paths.tsv

  # The only job that writes labels. Always runs, from the results of the checks.
  verdict:
    needs: [plan, abi, changelog]
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TITLE: ${{ github.event.pull_request.title }}
      APPROVAL_LABEL: ${{ inputs.approval-label }}
      GATED: ${{ needs.plan.outputs.gated }}
      CODE_CHANGED: ${{ needs.plan.outputs.code_changed }}
    steps:
      # A run for an older commit (another event kind runs side by side) must not write
      # labels onto a pull request whose head has moved on; the newer commit has its own run.
      - name: Check the pull request head
        id: head
        run: |
          set -uo pipefail
          CURRENT="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid 2>/dev/null || echo "$HEAD_SHA")"
          if [[ "$CURRENT" != "$HEAD_SHA" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::#${PR} moved to ${CURRENT}; this run is for ${HEAD_SHA} and writes nothing"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan the label changes
        id: plan
        if: ${{ steps.head.outputs.stale != 'true' }}
        run: |
          set -uo pipefail
          ABI_RESULT="$(jq -r '.abi.result' <<< "$RESULTS")"
          ABI_LABEL="$(jq -r '.abi.outputs.label // ""' <<< "$RESULTS")"
          # A fresh verdict replaces the labels. A code change without one, or an ABI run that
          # failed, clears them: a verdict that was not recomputed must not survive.
          if [[ "$ABI_RESULT" == "success" && -n "$ABI_LABEL" ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"; echo "verdict=${ABI_LABEL}" >> "$GITHUB_OUTPUT"
          elif [[ "$CODE_CHANGED" == "true" || "$ABI_RESULT" == "failure" || "$ABI_RESULT" == "cancelled" ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"; echo "verdict=" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Invalidate the recorded verdict before changing the labels
        if: ${{ steps.plan.outputs.apply == 'true' }}
        env:
          NEW_STATE: ${{ steps.plan.outputs.verdict == '' && 'failure' || 'pending' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "state=${NEW_STATE}" -f context=pre-merge/abi-verdict \
            -f "description=ABI verdict cleared: no verdict was computed for this commit" > /dev/null

      - name: Replace the verdict label
        id: replace
        if: ${{ steps.plan.outputs.apply == 'true' }}
        uses: awslabs/aws-crt-builder/.github/actions/validate-label@main
        with:
          verdict: ${{ steps.plan.outputs.verdict }}
          pr: ${{ github.event.pull_request.number }}

      # The labels carry the verdict, but a status is tied to one commit. A run that did not
      # compute the verdict (a label event) checks for it, so labels left over from another
      # commit can never turn the gate green, even if a newer run replaced this commit's run.
      - name: Record the commit the verdict is for
        if: ${{ steps.replace.outcome == 'success' && steps.plan.outputs.verdict != '' }}
        env:
          VERDICT: ${{ steps.plan.outputs.verdict }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context=pre-merge/abi-verdict -f "description=ABI verdict: ${VERDICT}" > /dev/null

      - name: Make sure the approval label exists
        if: ${{ !cancelled() && steps.head.outputs.stale != 'true' && env.GATED == 'true' }}
        run: gh label create "$APPROVAL_LABEL" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "A maintainer approved running CI on this pull request" >/dev/null 2>&1 || true

      - name: Withdraw the approval after a code change
        if: ${{ !cancelled() && steps.head.outputs.stale != 'true' && env.GATED == 'true' && env.CODE_CHANGED == 'true' }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$APPROVAL_LABEL" || true

      - name: Publish the gate status
        if: ${{ !cancelled() && steps.head.outputs.stale != 'true' }}
        env:
          LABEL_UPDATE: ${{ steps.replace.outcome }}
        run: |
          set -uo pipefail
          shopt -s nocasematch
          FAILED="$(jq -r 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | map(.key + "=" + .value.result) | join(", ")' <<< "$RESULTS")"
          if [[ -n "$FAILED" ]]; then
            STATE=failure; REASON="pre-merge check(s) did not pass: ${FAILED}"
          elif [[ "$LABEL_UPDATE" == "failure" ]]; then
            STATE=failure; REASON="could not update the verdict labels; re-run the workflow"
          elif ! LABELS="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name')"; then
            STATE=failure; REASON="could not read the labels on #${PR}"
          elif [[ "$GATED" == "true" && -z "$APPROVAL_LABEL" ]]; then
            STATE=failure; REASON="this pull request is from a fork and the caller sets no approval-label"
          elif [[ "$GATED" == "true" ]] && ! grep -qxiF "$APPROVAL_LABEL" <<< "$LABELS"; then
            STATE=failure; REASON="waiting for a maintainer to add the ${APPROVAL_LABEL} label"
          elif [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" --jq '.statuses | map(select(.context == "pre-merge/abi-verdict" and .state == "success")) | length' 2>/dev/null || echo 0)" == "0" ]]; then
            if [[ "$GATED" == "true" ]]; then
              STATE=failure; REASON="${APPROVAL_LABEL} is set but the ABI check has no verdict for this commit: remove and re-add ${APPROVAL_LABEL}"
            else
              STATE=failure; REASON="the ABI check has no successful verdict for this commit (it failed, was cleared or has not run): fix and push, or re-run the workflow"
            fi
          elif [[ "$TITLE" =~ ^chore(\([^\)]+\))?!?: ]] && grep -qxiE 'minor|needs-review' <<< "$LABELS"; then
            STATE=failure; REASON="titled chore but the ABI check found a possible break: retitle it change, feat or fix and add a fragment"
          elif grep -qxiF needs-review <<< "$LABELS"; then
            STATE=failure; REASON="labeled needs-review: a maintainer must REPLACE it with patch or minor; deleting it leaves this blocked"
          elif ! grep -qxiE 'patch|minor' <<< "$LABELS"; then
            STATE=failure; REASON="no patch or minor label: the verdict was removed or not produced; push again or re-run to recompute it"
          else
            STATE=success; REASON="all pre-merge checks passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "state=${STATE}" -f "context=pre-merge/gate" -f "description=${REASON:0:140}" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          [[ "$STATE" == "success" ]] || { echo "::error::${REASON}"; exit 1; }
