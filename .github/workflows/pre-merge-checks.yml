# Everything that must be true before a PR merges, in one workflow.
#
# Consumers call this from a single `pull_request_target` workflow. It calls the
# existing check-abi action unchanged: this workflow resolves the two commits to
# compare and passes the base one through check-abi's `base-ref` input, so the
# action needs no knowledge of PR events.
#
# Labelling and the merge gate live here rather than in check-abi, because a
# label applied with GITHUB_TOKEN raises no `labeled` workflow run:
#
#   "events triggered by the GITHUB_TOKEN will not create a new workflow run
#    ... Other pull_request activity types (such as labeled, edited, or closed)
#    do not create workflow runs"
#
# A separate label-gate workflow therefore never re-runs when the verdict
# lands, and reads whatever label the previous commit left. Ordering has to come
# from `needs:` inside one run. `block-needs-review-label.yml` stays in place
# until every repo has migrated here, then it can be deleted.
name: Pre-merge checks

on:
  workflow_call:
    inputs:
      lib-name:
        description: 'C library name for the ABI check, e.g. aws-c-common.'
        required: true
        type: string
      builder-version:
        description: 'Builder version/channel, and the ABI docker image tag.'
        required: false
        type: string
        default: 'latest'
      builder-source:
        description: 'Builder artifact source prefix (releases | channels).'
        required: false
        type: string
        default: 'releases'
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      runs-on:
        required: false
        type: string
        default: 'ubuntu-24.04'
      approval-environment:
        description: >-
          Environment whose required reviewers gate execution of PR-authored
          code. The caller passes a name for fork PRs and '' otherwise; ''
          means no environment and no wait.
        required: false
        type: string
        default: ''
      changelog-enabled:
        description: >-
          Run the changelog check. Off by default: the changelog action does not
          exist on aws-crt-builder@main yet, so enabling it before that would
          fail every PR.
        required: false
        type: boolean
        default: false
      changes-dir:
        required: false
        type: string
        default: '.changes'
      status-context:
        description: >-
          Commit-status context posted by the gate. This, not a check-run name,
          is the string to put in a branch ruleset: the combined-status API is
          documented as "success if the latest status for all contexts is
          success", so a later run definitively supersedes an earlier one.
        required: false
        type: string
        default: 'pre-merge/gate'
    secrets:
      CRT_CI_ROLE_ARN:
        required: false

# Every skip below is a job-level `if:`, which reports a check run with
# conclusion `skipped` and does not block. There is deliberately no
# workflow-level paths:/branches: filter: a workflow that never runs reports
# nothing and leaves a required context Expected forever.
jobs:
  # Holds the deployment environment and nothing else, so the credential-minting
  # job below does not reference an environment and its OIDC `sub` is unchanged.
  # Future jobs (ci.yml) hang off this same approval with `needs: approval`.
  #
  # This job's `if:` is the only place the "could the code have changed?"
  # predicate is written; `abi` inherits it via `needs:`.
  approval:
    name: Fork approval
    if: >-
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
      || (github.event.action == 'edited' && github.event.changes.base != null)
    runs-on: ${{ inputs.runs-on }}
    permissions: {}
    environment: ${{ inputs.approval-environment }}
    steps:
      - name: Approved
        run: echo "PR-authored code is approved to execute in this run."

  abi:
    name: ABI compatibility
    needs: approval
    runs-on: ${{ inputs.runs-on }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CRT_CI_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          # head.sha, not head.ref: fork branches named `main` exist, and a bare
          # ref resolves against the base repo. Under pull_request_target the
          # default checkout is the base branch, which would diff main against
          # itself.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Required from v4 onward to check out fork PR code under
          # pull_request_target. The approval job above is what makes it
          # acceptable.
          allow-unsafe-pr-checkout: true
          # This tree is bind-mounted into a container that runs PR-authored
          # CMake; leave no usable credential in .git/config.
          persist-credentials: false

      - name: Resolve the commits to compare
        id: refs
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          # The MERGE BASE, not the tip of the base branch. Diffing against the
          # tip attributes every change that landed on the base branch since
          # this PR forked to the PR itself, so a branch behind its base reports
          # a verdict for commits it never contained -- and that verdict changes
          # as unrelated PRs merge.
          BASE_SHA="$(git merge-base HEAD "origin/${BASE_BRANCH}")"
          echo "Comparing ${BASE_SHA} (merge base) -> $(git rev-parse HEAD) (PR head)"
          echo "base-sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check ABI
        id: check
        uses: awslabs/aws-crt-builder/.github/actions/check-abi@main
        with:
          lib-name: ${{ inputs.lib-name }}
          builder-version: ${{ inputs.builder-version }}
          builder-source: ${{ inputs.builder-source }}
          # Passing base-ref makes the action compare exactly these two commits
          # and skip its own labelling, which the next step does instead.
          base-ref: ${{ steps.refs.outputs.base-sha }}

      - name: Apply the verdict labels
        if: ${{ steps.check.outputs.label != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.check.outputs.label }}
        run: |
          set -euo pipefail
          # The three verdicts are mutually exclusive, exactly as gate.sh
          # emits them. `patch` and `minor` ARE the reviewed states, so pairing
          # either with `needs-review` would assert two contradictory things at
          # once -- and a merged PR carrying `minor` forces a minor release bump
          # (auto-release's minor-pr-label), which would under-state a source
          # break. To clear a source break a maintainer REPLACES needs-review
          # with patch or minor, which records that a human decided the release
          # impact. Merely deleting the label leaves the PR blocked, correctly:
          # nothing has said what the impact is.
          case "$VERDICT" in
            patch)        WANT="patch" ;;
            minor)        WANT="minor" ;;
            needs-review) WANT="needs-review" ;;
            *) echo "::error::unexpected ABI verdict '${VERDICT}'"; exit 1 ;;
          esac

          declare -A COLOR=( [patch]=0e8a16 [minor]=fbca04 [needs-review]=d93f0b )
          declare -A DESC=(
            [patch]="ABI backward-compatible (patch release)"
            [minor]="ABI changed, source-compatible (minor release)"
            [needs-review]="ABI check: source/API compatibility broken, needs manual review"
          )

          CURRENT="$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')"
          ADD=() DROP=()
          for l in patch minor needs-review; do
            if [[ " $WANT " == *" $l "* ]]; then
              grep -qxF "$l" <<< "$CURRENT" || ADD+=("$l")
            else
              grep -qxF "$l" <<< "$CURRENT" && DROP+=("$l")
            fi
          done

          if [[ "${#ADD[@]}" -eq 0 && "${#DROP[@]}" -eq 0 ]]; then
            echo "Labels already correct (${WANT}); nothing to do."
            exit 0
          fi

          EDIT=()
          for l in ${ADD[@]+"${ADD[@]}"}; do
            # gh pr edit --add-label fails if the label does not exist yet.
            gh label create "$l" --repo "$REPO" --color "${COLOR[$l]}" \
              --description "${DESC[$l]}" --force >/dev/null 2>&1 || true
            EDIT+=(--add-label "$l")
          done
          [[ "${#DROP[@]}" -gt 0 ]] && EDIT+=(--remove-label "$(IFS=,; echo "${DROP[*]}")")
          echo "add='${ADD[*]:-none}' remove='${DROP[*]:-none}'"
          gh pr edit "$PR" --repo "$REPO" "${EDIT[@]}"

  # Not behind `approval`: holds no credentials and checks out no PR code, so a
  # first-time fork contributor gets feedback with no maintainer click. No
  # activity-type filter either -- the fragment, the title and the waiver label
  # can each change independently, and the job takes seconds.
  changelog:
    name: Changelog entry
    if: >-
      inputs.changelog-enabled
      && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      # write, not read: a PR with no fragment gets one guidance comment
      # carrying a ready-to-paste template. Nothing else here writes.
      pull-requests: write
    steps:
      - name: Fetch the fragment at the PR head
        id: fragment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGES_DIR: ${{ inputs.changes-dir }}
        run: |
          set -euo pipefail
          # The fragment exists only on the PR branch and this job deliberately
          # has no checkout of it. The base repo's Contents API resolves a fork
          # head SHA, so read the blob instead -- that keeps
          # allow-unsafe-pr-checkout confined to the ABI job.
          DEST="${RUNNER_TEMP}/changes/preview"
          mkdir -p "$DEST"
          BODY="$(mktemp)"
          if gh api "repos/${REPO}/contents/${CHANGES_DIR}/preview/${PR}.json?ref=${HEAD_SHA}" \
               -H 'Accept: application/vnd.github.raw' > "$BODY" 2>/dev/null; then
            cp "$BODY" "${DEST}/${PR}.json"
            # present=true means "the author supplied a fragment". Whether it is
            # VALID is the check step's business. The distinction drives whether
            # a guidance comment is posted: a missing fragment means the author
            # does not know the convention and gets a template; an invalid one
            # means they do, and only need the validator's reason.
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a bare "Not Found" means "the ref resolved, the file is absent".
          # Anything else is infrastructure, and reporting it as a missing
          # fragment would waive the requirement instead of failing.
          MSG="$(jq -r '.message // "unparsable response"' < "$BODY" 2>/dev/null || echo 'unparsable response')"
          if [[ "$MSG" != "Not Found" ]]; then
            echo "::error::could not read the changelog fragment at ${HEAD_SHA}: ${MSG}"
            exit 1
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "No fragment present; a template comment and the check step follow."

      # Builds the template the comment carries. Written OUTSIDE
      # $RUNNER_TEMP/changes so the check step below cannot mistake it for a
      # fragment the author supplied. `seed` derives the type from the PR title
      # and falls back to chore, so the snippet is already tailored.
      - name: Seed a fragment template
        if: ${{ steps.fragment.outputs.present == 'false' }}
        # TODO: pin back to @main once the changelog action is on main.
        uses: awslabs/aws-crt-builder/.github/actions/changelog@feat/pre-merge-checks
        with:
          mode: seed
          pr: ${{ github.event.pull_request.number }}
          title: ${{ github.event.pull_request.title }}
          url: ${{ github.event.pull_request.html_url }}
          out: ${{ runner.temp }}/seed-template.json

      - name: Comment with the template, once per pull request
        if: ${{ steps.fragment.outputs.present == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGES_DIR: ${{ inputs.changes-dir }}
          TEMPLATE: ${{ runner.temp }}/seed-template.json
        run: |
          set -euo pipefail
          # Idempotency is keyed on a hidden marker rather than on the comment
          # text, so the wording can change later without the bot re-commenting
          # on every pull request that already has one.
          MARKER='<!-- pre-merge-checks:changelog-template -->'
          if gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
               --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Template comment already present on #${PR}; not repeating it."
            exit 0
          fi
          {
            printf '%s\n\n' "$MARKER"
            printf 'This pull request has no changelog entry.\n\n'
            printf 'Add `%s/preview/%s.json` with this content, adjusting the summary to read as a release note:\n\n' \
              "$CHANGES_DIR" "$PR"
            printf '```json\n'
            cat "$TEMPLATE"
            printf '```\n\n'
            printf '`type` is one of `feat`, `fix`, `doc`, `chore`, `revert`, and decides which section the entry lands in. '
            printf '`notes` is optional free-form detail.\n\n'
            printf 'Running `.github/actions/changelog/scripts/new-change` locally writes the file for you.\n\n'
            printf 'For a CI-only or pure-infra change, apply the `skip-changelog` label instead.\n'
          } > "${RUNNER_TEMP}/comment.md"
          # jq builds the JSON body so the markdown is carried verbatim --
          # newlines, backticks and quotes all survive, which -f/-F would not
          # reliably do for a multi-line value.
          jq -n --rawfile body "${RUNNER_TEMP}/comment.md" '{body: $body}' \
            | gh api --method POST "repos/${REPO}/issues/${PR}/comments" --input - >/dev/null
          echo "Posted the changelog template comment on #${PR}."

      # Always runs, and is what fails the job. A missing fragment fails here
      # too, after the comment above; a fragment that is present but malformed
      # fails here with the validator's own reason and no comment.
      - name: Check the fragment
        # TODO: pin back to @main once the changelog action is on main.
        uses: awslabs/aws-crt-builder/.github/actions/changelog@feat/pre-merge-checks
        with:
          mode: check
          pr: ${{ github.event.pull_request.number }}
          changes-dir: ${{ runner.temp }}/changes

  # The single gate, and the only job that is unconditionally reachable -- so
  # the only one that may become a required status check.
  gate:
    name: Pre-merge gate
    needs: [approval, abi, changelog]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      pull-requests: read
      checks: read
      statuses: write
    steps:
      - name: Decide and publish the gate status
        env:
          RESULTS: ${{ toJSON(needs) }}
          ABI_RESULT: ${{ needs.abi.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONTEXT: ${{ inputs.status-context }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Not -e: every path must reach the status post.
          set -uo pipefail
          printf '%s\n' "$RESULTS"
          VERDICT="" REASON=""

          # 1. Any job that actually failed fails the gate.
          BAD="$(jq -r 'to_entries
                        | map(select(.value.result == "failure" or .value.result == "cancelled"))
                        | map(.key + "=" + .value.result) | join(", ")' <<< "$RESULTS")"
          if [[ -n "$BAD" ]]; then
            VERDICT=failure; REASON="pre-merge check(s) did not pass: ${BAD}"
          fi

          # 2. `skipped` is how "do not re-run what cannot have changed" is
          #    expressed, so it is accepted -- but not blindly. Labels are
          #    per-PR while commits are not, so on a relabel event confirm a
          #    successful ABI run exists for THIS head SHA before trusting the
          #    labels read below. Matched on the name suffix: the full context
          #    is "<caller job id> / ABI compatibility" and the caller's job id
          #    is not visible from here.
          if [[ -z "$VERDICT" && "$ABI_RESULT" == "skipped" ]]; then
            RUNS="$(gh api --paginate \
                      "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=all&per_page=100" \
                      --jq '.check_runs[] | select(.name | endswith("ABI compatibility"))
                            | "\(.status):\(.conclusion // "none")"')"
            if [[ $? -ne 0 ]]; then
              VERDICT=failure; REASON="could not list check runs for ${HEAD_SHA}"
            elif grep -qE '^(queued|in_progress):' <<< "$RUNS"; then
              # The run that owns this commit's verdict will post the status.
              echo "::notice::an ABI check for ${HEAD_SHA} is still running; deferring to it."
              exit 0
            elif ! grep -q '^completed:success$' <<< "$RUNS"; then
              VERDICT=failure
              REASON="no successful ABI check exists for ${HEAD_SHA}; re-run it or push again"
            fi
          fi

          # 3. The release impact must be decided and undisputed. Read LIVE
          #    labels, not the ABI job's output, so a maintainer who reviewed an
          #    accepted API break and removed needs-review unblocks the PR
          #    without pushing a commit.
          if [[ -z "$VERDICT" ]]; then
            LABELS="$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')"
            if grep -qxF 'needs-review' <<< "$LABELS"; then
              VERDICT=failure
              REASON="labeled needs-review: the ABI check found a source break, so callers fail to recompile. A maintainer must review it and REPLACE that label with patch or minor, which records the release impact they decided on. Deleting it without replacing leaves this blocked."
            elif ! grep -qxE 'patch|minor' <<< "$LABELS"; then
              VERDICT=failure
              REASON="no patch or minor label, so the release impact is undecided. Re-run the ABI check; do not hand-apply the label."
            fi
          fi

          [[ -z "$VERDICT" ]] && { VERDICT=success; REASON="all pre-merge checks passed or were legitimately skipped"; }

          echo "Gate: ${VERDICT} -- ${REASON}"
          gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f "state=${VERDICT}" -f "context=${CONTEXT}" \
            -f "description=${REASON:0:139}" -f "target_url=${RUN_URL}" >/dev/null || {
              echo "::error::could not post the '${CONTEXT}' commit status."; exit 1; }

          [[ "$VERDICT" == "success" ]] || { echo "::error::${REASON}"; exit 1; }
