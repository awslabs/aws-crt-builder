# Pre-merge checks run in parallel; `verdict` aggregates them and posts the required
# `pre-merge/gate` status. To add a check, add a job (with `needs: plan` and the
# `run_credentialed` condition if it needs credentials) and list it in `verdict.needs`.
#
# Caller:
#
#   on:
#     pull_request_target:
#       types: [opened, reopened, synchronize, edited, labeled, unlabeled]
#   concurrency:
#     group: pre-merge-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   jobs:
#     pre-merge:
#       permissions:
#         contents: read
#         pull-requests: write
#         id-token: write
#         statuses: write
#       uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@main
#       with:
#         lib-name: aws-c-common
#         approval-label: ci-ready
#       secrets:
#         CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}
name: Pre-merge checks

on:
  workflow_call:
    inputs:
      lib-name:
        description: 'C library name for the ABI check, e.g. aws-c-common.'
        required: true
        type: string
      approval-label:
        description: >-
          Label a maintainer adds to let a fork pull request run the credentialed
          checks. A push removes it. Required for fork pull requests: with '' they never
          run the credentialed checks.
        required: false
        type: string
        default: ''
      approval-environment:
        description: 'Ignored; fork pull requests are gated by approval-label. Kept so existing callers keep working.'
        required: false
        type: string
        default: ''
      gate-same-repo:
        description: 'Apply the approval label to same-repo pull requests too (for testing the gate).'
        required: false
        type: boolean
        default: false
      abi-image-registry:
        description: 'ECR registry holding the aws-crt-ubuntu-22-abi-x64 image the ABI check runs in.'
        required: false
        type: string
        default: '123124136734.dkr.ecr.us-east-1.amazonaws.com'
      runs-on:
        required: false
        type: string
        default: 'ubuntu-24.04'
    secrets:
      CRT_CI_ROLE_ARN:
        required: false

jobs:
  plan:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      statuses: write
    outputs:
      gated: ${{ steps.p.outputs.gated }}
      code_changed: ${{ steps.p.outputs.code_changed }}
      run_credentialed: ${{ steps.p.outputs.run_credentialed }}
    steps:
      - name: Mark the gate pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending -f context=pre-merge/gate -f "description=re-checking after ${ACTION}" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null

      - name: Plan
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          APPROVAL_LABEL: ${{ inputs.approval-label }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          GATE_SAME_REPO: ${{ inputs.gate-same-repo }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          CODE=false
          case "$ACTION" in
            opened|reopened|synchronize) CODE=true ;;
            edited) [[ "$BASE_CHANGED" == "true" ]] && CODE=true ;;
          esac
          GATED=false
          [[ "$FORK" == "true" || "$GATE_SAME_REPO" == "true" ]] && GATED=true
          DESC="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
                    --jq '.statuses[] | select(.context == "pre-merge/abi-verdict") | .description')"
          RESULT=none
          [[ "$DESC" == *" vs ${BASE_REF}" ]] && RESULT="${DESC%% vs *}"
          NEED=false
          [[ "$RESULT" == "none" || ( "$RESULT" == "error" && "$RUN_ATTEMPT" -gt 1 ) ]] && NEED=true
          RUN=false
          if [[ "$NEED" == "true" ]]; then
            if [[ "$GATED" == "true" ]]; then
              [[ -n "$APPROVAL_LABEL" && "$ACTION" == "labeled" && "${LABEL_NAME,,}" == "${APPROVAL_LABEL,,}" ]] && RUN=true
            else
              RUN=true
            fi
          fi
          echo "ABI result for ${HEAD_SHA} vs ${BASE_REF}: ${RESULT}; run the ABI check: ${RUN}"
          { echo "gated=$GATED"; echo "code_changed=$CODE"; echo "run_credentialed=$RUN"; } >> "$GITHUB_OUTPUT"

  abi:
    needs: plan
    if: ${{ needs.plan.outputs.run_credentialed == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.check.outputs.label }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CRT_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Resolve the commits to compare
        id: refs
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet "origin/${BASE_BRANCH}" > /dev/null \
            || { echo "::error::origin/${BASE_BRANCH} is missing from the checkout"; exit 1; }
          echo "base-sha=$(git merge-base HEAD "origin/${BASE_BRANCH}")" >> "$GITHUB_OUTPUT"

      - name: Check ABI
        id: check
        uses: awslabs/aws-crt-builder/.github/actions/check-abi@main
        with:
          lib-name: ${{ inputs.lib-name }}
          builder-version: latest
          base-ref: ${{ steps.refs.outputs.base-sha }}
          image-registry: ${{ inputs.abi-image-registry }}

  changelog:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Read the fragment and changed paths at the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/changes/preview"
          FRAG="${RUNNER_TEMP}/changes/preview/${PR}.json"
          # Only a 404 means there is no fragment.
          fetch() { gh api "repos/${GITHUB_REPOSITORY}/contents/.changes/preview/${PR}.json?ref=$1" \
                      -H 'Accept: application/vnd.github.raw' > "$FRAG" 2> "${RUNNER_TEMP}/fetch.err"; }
          if ! fetch "${HEAD_SHA}"; then
            if grep -q 'HTTP 404' "${RUNNER_TEMP}/fetch.err"; then
              # A fork's commit may not resolve here by sha; try the PR ref.
              if ! fetch "refs/pull/${PR}/head"; then
                grep -q 'HTTP 404' "${RUNNER_TEMP}/fetch.err" || { cat "${RUNNER_TEMP}/fetch.err" >&2; exit 1; }
                rm -f "$FRAG"
              fi
            else
              cat "${RUNNER_TEMP}/fetch.err" >&2; exit 1
            fi
          fi
          # @tsv escapes tabs and newlines in paths.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" \
            --jq '.[] | (select(.filename | startswith(".changes/")) | [.status, .filename]), (select((.previous_filename // "") | startswith(".changes/")) | ["removed", .previous_filename]) | @tsv' \
            > "${RUNNER_TEMP}/changed-paths.tsv"

      - name: Check the PR title and the fragment
        uses: awslabs/aws-crt-builder/.github/actions/changelog@main
        with:
          mode: check
          changes-dir: ${{ runner.temp }}/changes
          changed-paths-file: ${{ runner.temp }}/changed-paths.tsv

  verdict:
    needs: [plan, abi, changelog]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      TITLE: ${{ github.event.pull_request.title }}
      APPROVAL_LABEL: ${{ inputs.approval-label }}
      GATED: ${{ needs.plan.outputs.gated }}
      CODE_CHANGED: ${{ needs.plan.outputs.code_changed }}
    steps:
      - name: Check the pull request head
        id: head
        run: |
          set -uo pipefail
          CURRENT="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefName -q '"\(.headRefOid) \(.baseRefName)"' 2>/dev/null || echo "$HEAD_SHA $BASE_REF")"
          if [[ "$CURRENT" != "$HEAD_SHA $BASE_REF" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::#${PR} is now at ${CURRENT}; this run is for ${HEAD_SHA} ${BASE_REF} and writes nothing"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # Labels change only when the result differs from the recorded one; patch never replaces minor.
      - name: Plan the label changes
        id: plan
        if: ${{ steps.head.outputs.stale != 'true' }}
        run: |
          set -uo pipefail
          ABI_RESULT="$(jq -r '.abi.result' <<< "$RESULTS")"
          ABI_LABEL="$(jq -r '.abi.outputs.label // ""' <<< "$RESULTS")"
          FRESH=none
          if [[ "$ABI_RESULT" == "success" && -n "$ABI_LABEL" ]]; then FRESH="$ABI_LABEL"
          elif [[ "$ABI_RESULT" == "success" || "$ABI_RESULT" == "failure" ]]; then FRESH=error; fi
          PREV=none
          DESC="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
                    --jq '.statuses[] | select(.context == "pre-merge/abi-verdict") | .description' 2>/dev/null || true)"
          [[ "$DESC" == *" vs ${BASE_REF}" ]] && PREV="${DESC%% vs *}"
          if [[ "$FRESH" == "none" || "$FRESH" == "$PREV" ]]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERDICT="$FRESH"
          [[ "$FRESH" == "error" ]] && VERDICT=""
          if [[ "$FRESH" == "patch" ]] && gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name' | grep -qxiF minor; then
            VERDICT=minor
          fi
          { echo "apply=true"; echo "verdict=${VERDICT}"; echo "record=${FRESH}"; } >> "$GITHUB_OUTPUT"

      - name: Replace the verdict label
        id: replace
        if: ${{ steps.plan.outputs.apply == 'true' }}
        uses: awslabs/aws-crt-builder/.github/actions/validate-label@main
        with:
          verdict: ${{ steps.plan.outputs.verdict }}
          pr: ${{ github.event.pull_request.number }}

      - name: Record the ABI result for this commit
        id: record
        if: ${{ steps.replace.outcome == 'success' }}
        env:
          RECORD: ${{ steps.plan.outputs.record }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context=pre-merge/abi-verdict -f "description=${RECORD} vs ${BASE_REF}" > /dev/null

      - name: Make sure the approval label exists
        if: ${{ !cancelled() && steps.head.outputs.stale != 'true' && env.GATED == 'true' && env.APPROVAL_LABEL != '' }}
        run: gh label create "$APPROVAL_LABEL" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "A maintainer approved running CI on this pull request" >/dev/null 2>&1 || true

      - name: Withdraw the approval after a code change
        if: ${{ !cancelled() && steps.head.outputs.stale != 'true' && env.GATED == 'true' && env.CODE_CHANGED == 'true' && env.APPROVAL_LABEL != '' }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$APPROVAL_LABEL" || true

      - name: Publish the gate status
        if: ${{ !cancelled() && steps.head.outputs.stale != 'true' }}
        env:
          LABEL_UPDATE: ${{ steps.replace.outcome }}
          RECORDED_NOW: ${{ steps.record.outcome == 'success' && steps.plan.outputs.record || '' }}
        run: |
          set -uo pipefail
          shopt -s nocasematch
          # A status posted moments ago may not read back yet.
          RESULT="${RECORDED_NOW:-none}"
          if [[ "$RESULT" == "none" ]]; then
            DESC="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
                      --jq '.statuses[] | select(.context == "pre-merge/abi-verdict") | .description' 2>/dev/null || true)"
            [[ "$DESC" == *" vs ${BASE_REF}" ]] && RESULT="${DESC%% vs *}"
          fi
          LABELS_OK=true
          LABELS="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name')" || LABELS_OK=false
          # patch or minor over an ABI error is a maintainer override.
          OVERRIDE=false
          [[ "$RESULT" == "error" ]] && grep -qxiE 'patch|minor' <<< "$LABELS" && ! grep -qxiF needs-review <<< "$LABELS" && OVERRIDE=true
          FAILED="$(jq -r --argjson ov "$OVERRIDE" 'to_entries | map(select((.value.result == "failure" or .value.result == "cancelled") and ($ov == false or .key != "abi"))) | map(.key + "=" + .value.result) | join(", ")' <<< "$RESULTS")"
          if [[ "$LABEL_UPDATE" == "failure" ]]; then
            STATE=failure; REASON="could not update the verdict labels; re-run all jobs"
          elif [[ "$LABELS_OK" != "true" ]]; then
            STATE=failure; REASON="could not read the labels on #${PR}"
          elif [[ "$TITLE" =~ ^chore(\([^\)]+\))?!?: ]] && grep -qxiE 'minor|needs-review' <<< "$LABELS"; then
            STATE=failure; REASON="titled chore but the ABI check found a possible break: retitle it change, feat or fix and add a fragment"
          elif [[ -n "$FAILED" ]]; then
            STATE=failure; REASON="pre-merge check(s) did not pass: ${FAILED}"
            [[ "$RESULT" == "error" ]] && REASON="${REASON} (ABI error: re-run all jobs, or a maintainer adds patch or minor)"
          elif [[ "$RESULT" == "none" ]]; then
            if [[ "$GATED" == "true" && -z "$APPROVAL_LABEL" ]]; then
              STATE=failure; REASON="this pull request is from a fork and the caller sets no approval-label"
            elif [[ "$GATED" == "true" ]]; then
              STATE=failure; REASON="waiting for a maintainer to add the ${APPROVAL_LABEL} label"
            else
              STATE=failure; REASON="the ABI check has not run for this commit: re-run all jobs"
            fi
          elif grep -qxiE 'patch|minor' <<< "$LABELS" && ! grep -qxiF needs-review <<< "$LABELS"; then
            STATE=success; REASON="all pre-merge checks passed"
          elif grep -qxiF needs-review <<< "$LABELS"; then
            STATE=failure; REASON="labeled needs-review: a maintainer must REPLACE it with patch or minor; deleting it leaves this blocked"
          elif [[ "$RESULT" == "error" ]]; then
            STATE=failure; REASON="the ABI check errored for this commit: re-run all jobs, or a maintainer adds patch or minor to accept it"
          else
            STATE=failure; REASON="no patch or minor label: a maintainer removed the verdict; add patch or minor"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "state=${STATE}" -f "context=pre-merge/gate" -f "description=${REASON:0:140}" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          [[ "$STATE" == "success" ]] || { echo "::error::${REASON}"; exit 1; }
