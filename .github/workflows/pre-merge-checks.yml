# Everything that must be true before a pull request merges, in one workflow.
#
# Consumers call this from a single `pull_request_target` workflow. It replaces
# per-repo check-abi.yml and block-needs-review.yml.
#
# Labelling and the merge gate live here rather than in check-abi because a label
# applied with GITHUB_TOKEN raises no `labeled` workflow run -- "Other
# pull_request activity types (such as labeled, edited, or closed) do not create
# workflow runs" -- so a standalone gate workflow never re-runs when the verdict
# lands and reads whatever the previous commit left. Ordering has to come from
# `needs:` inside one run.
#
# CHECK NAMES. A job that calls a reusable workflow reports as
# "<caller job> / <callee job>"; neither segment can be suppressed (verified:
# block-needs-review-label.yml's single `gate` job, called from a job also named
# `gate`, reports as "gate / gate"). Consumers name their caller job `upkeep`, so
# the required-check contexts are "upkeep / approval", "upkeep / abi-compat",
# "upkeep / changelog" and "upkeep / verdict-gate", displayed in the merge box as
# "Pre-merge checks / upkeep / <job>".
#
# Those context strings go into 12 branch rulesets. Renaming a job here orphans
# every entry, and `pre-merge-gate` matches the ABI check run by the `abi-compat`
# suffix -- rename that job and the freshness assertion silently stops finding it.
name: Pre-merge checks

on:
  workflow_call:
    inputs:
      lib-name:
        description: 'C library name for the ABI check, e.g. aws-c-common.'
        required: true
        type: string
      approval-environment:
        description: >-
          Environment whose required reviewers gate execution of PR-authored
          code. The caller passes a name for fork pull requests and '' otherwise;
          '' means no environment and no wait.
        required: false
        type: string
        default: ''
      builder-version:
        required: false
        type: string
        default: 'latest'
      builder-source:
        required: false
        type: string
        default: 'releases'
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      runs-on:
        required: false
        type: string
        default: 'ubuntu-24.04'
      status-context:
        description: >-
          Commit-status context posted by Validation. A status rather than a
          check run: the combined-status API is documented as "success if the
          latest status for all contexts is success", so a later run supersedes
          an earlier one, and it is independent of every job name.
        required: false
        type: string
        default: 'pre-merge/gate'
    secrets:
      CRT_CI_ROLE_ARN:
        required: false

jobs:
  # Holds the deployment environment and nothing else, so the credential-minting
  # job below never references an environment and its OIDC `sub` is unchanged.
  # Future jobs hang off this same approval with `needs: approval`.
  #
  # This job's `if:` is the only place the "could the code have changed?"
  # predicate is written; `abi` inherits it through `needs:`.
  approval:
    if: >-
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
      || (github.event.action == 'edited' && github.event.changes.base != null)
    runs-on: ${{ inputs.runs-on }}
    permissions: {}
    # Empty means no environment and no wait. Operand order matters:
    # `cond && '' || 'x'` always yields 'x', because '' is falsy.
    environment: ${{ inputs.approval-environment }}
    steps:
      - name: Approved
        run: echo "PR-authored code is approved to execute in this run."

  abi-compat:
    needs: approval
    runs-on: ${{ inputs.runs-on }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CRT_CI_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          # head.sha, not head.ref: fork branches named `main` exist, and a bare
          # ref resolves against the base repo. Under pull_request_target the
          # default checkout is the base branch, which would diff main with
          # itself and always report `patch`.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Required from v4 onward to check out fork PR code under
          # pull_request_target. The approval job is what makes it acceptable.
          # actionlint <= 1.7.12 reports this input as undefined; its bundled
          # metadata predates actions/checkout f9e715a9 (2026-06-16).
          allow-unsafe-pr-checkout: true
          # This tree is bind-mounted into a container that runs PR-authored
          # CMake; leave no usable credential in .git/config.
          persist-credentials: false

      - name: Resolve the commits to compare
        id: refs
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          # The MERGE BASE, not the tip of the base branch. Diffing against the
          # tip attributes every change that landed on the base branch since
          # this PR forked to the PR itself, so a branch behind its base reports
          # a verdict for commits it never contained, and that verdict changes
          # as unrelated pull requests merge.
          BASE_SHA="$(git merge-base HEAD "origin/${BASE_BRANCH}")"
          echo "Comparing ${BASE_SHA} (merge base) -> $(git rev-parse HEAD) (PR head)"
          echo "base-sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check ABI
        id: check
        uses: awslabs/aws-crt-builder/.github/actions/check-abi@main
        with:
          lib-name: ${{ inputs.lib-name }}
          builder-version: ${{ inputs.builder-version }}
          builder-source: ${{ inputs.builder-source }}
          # Passing base-ref makes the action compare exactly these two commits
          # and skip its own labelling, which the next step does instead.
          base-ref: ${{ steps.refs.outputs.base-sha }}

      - name: Apply the verdict label
        if: ${{ steps.check.outputs.label != '' }}
        # TODO: pin back to @main once this action is on main.
        uses: awslabs/aws-crt-builder/.github/actions/abi-label@feat/pre-merge-checks
        with:
          verdict: ${{ steps.check.outputs.label }}
          pr: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}

  # Deliberately not behind `approval`: holds no credentials and checks out no
  # PR code, so a first-time fork contributor gets feedback with no maintainer
  # click. No activity-type filter either -- the fragment, the title and the
  # waiver label can each change independently, and the job takes seconds.
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      # write, not read: a pull request with no fragment gets one guidance
      # comment carrying a ready-to-paste template.
      pull-requests: write
    steps:
      - name: Fetch the fragment at the PR head
        id: fragment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The fragment exists only on the PR branch and this job deliberately
          # has no checkout of it. The base repo's Contents API resolves a fork
          # head SHA, so read the blob instead -- that keeps
          # allow-unsafe-pr-checkout confined to the ABI job.
          DEST="${RUNNER_TEMP}/changes/preview"
          mkdir -p "$DEST"
          BODY="$(mktemp)"
          if gh api "repos/${REPO}/contents/.changes/preview/${PR}.json?ref=${HEAD_SHA}" \
               -H 'Accept: application/vnd.github.raw' > "$BODY" 2>/dev/null; then
            cp "$BODY" "${DEST}/${PR}.json"
            exit 0
          fi
          # Only a bare "Not Found" means "the ref resolved, the file is absent".
          # Anything else is infrastructure, and reporting it as a missing
          # fragment would waive the requirement instead of failing.
          MSG="$(jq -r '.message // "unparsable response"' < "$BODY" 2>/dev/null || echo 'unparsable response')"
          if [[ "$MSG" != "Not Found" ]]; then
            echo "::error::could not read the changelog fragment at ${HEAD_SHA}: ${MSG}"
            exit 1
          fi
          echo "No fragment present; the check step decides whether that matters."

      - name: List the pull request's changes under .changes/
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # `status<TAB>path` for every changed path under .changes/. The check
          # asserts a customer-visible change adds exactly one new fragment, at
          # exactly its own path -- a fragment named for another pull request
          # renders under that number, and one at another path renders nowhere.
          # Documented cap: this endpoint returns at most 3000 files.
          OUT="${RUNNER_TEMP}/changed-changes-paths.tsv"
          gh api --paginate "repos/${REPO}/pulls/${PR}/files?per_page=100" \
            --jq '.[] | select(.filename | startswith(".changes/"))
                  | "\(.status)\t\(.filename)"' > "$OUT"
          echo "file=${OUT}" >> "$GITHUB_OUTPUT"
          echo "Changed paths under .changes/:"
          sed 's/^/  /' "$OUT" || true

      # Runs before the comment, because only it can say whether a fragment was
      # required. A chore needs none, and a title that breaks the convention has
      # a different problem -- neither should be told to paste a template.
      # This step does not fail the job; the last step does.
      - name: Check the PR title and the fragment
        id: check
        # TODO: pin back to @main once the changelog action is on main.
        uses: awslabs/aws-crt-builder/.github/actions/changelog@feat/pre-merge-checks
        with:
          mode: check
          pr: ${{ github.event.pull_request.number }}
          # An action input, so the script receives it as an env var. Never
          # interpolate a PR title into a run: body.
          title: ${{ github.event.pull_request.title }}
          # Bots cannot be asked to retitle, and failing every dependency bump
          # would train people to ignore the check.
          bot-author: ${{ endsWith(github.event.pull_request.user.login, '[bot]') && github.event.pull_request.user.login || '' }}
          changes-dir: ${{ runner.temp }}/changes
          changed-paths-file: ${{ steps.paths.outputs.file }}
          changes-prefix: .changes

      - name: Seed a fragment template
        if: ${{ steps.check.outputs.reason == 'missing-fragment' }}
        uses: awslabs/aws-crt-builder/.github/actions/changelog@feat/pre-merge-checks
        with:
          mode: seed
          pr: ${{ github.event.pull_request.number }}
          title: ${{ github.event.pull_request.title }}
          url: ${{ github.event.pull_request.html_url }}
          # Outside $RUNNER_TEMP/changes so nothing mistakes it for a fragment
          # the author supplied.
          out: ${{ runner.temp }}/seed-template.json

      - name: Comment with the template, once per pull request
        if: ${{ steps.check.outputs.reason == 'missing-fragment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TEMPLATE: ${{ runner.temp }}/seed-template.json
        run: |
          set -euo pipefail
          # Keyed on a hidden marker rather than the comment text, so the wording
          # can be revised later without the bot re-commenting on every pull
          # request that already has one.
          MARKER='<!-- pre-merge-checks:changelog-template -->'
          if gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
               --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Template comment already present on #${PR}; not repeating it."
            exit 0
          fi
          {
            printf '%s\n\n' "$MARKER"
            printf 'This pull request has no changelog entry.\n\n'
            printf 'Add `.changes/preview/%s.json` with this content, adjusting the summary to read as a release note:\n\n' "$PR"
            printf '```json\n'
            cat "$TEMPLATE"
            printf '```\n\n'
            printf '`type` is one of `feat`, `fix`, `chore`, `revert`, and decides which section the entry lands in. '
            printf '`notes` is optional free-form detail -- for a revert, say why.\n\n'
            printf 'A `chore` needs no entry at all. For a CI-only or pure-infra change, apply the `skip-changelog` label instead.\n'
          } > "${RUNNER_TEMP}/comment.md"
          # jq builds the body so the markdown survives verbatim.
          jq -n --rawfile body "${RUNNER_TEMP}/comment.md" '{body: $body}' \
            | gh api --method POST "repos/${REPO}/issues/${PR}/comments" --input - >/dev/null
          echo "Posted the changelog template comment on #${PR}."

      - name: Fail if the changelog check did not pass
        if: ${{ steps.check.outputs.rc != '0' }}
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "::error::changelog check failed (${REASON:-unknown}); see the step above."
          exit 1

  # The single gate, and the only job that is unconditionally reachable -- so the
  # only one that may become a required status check.
  verdict-gate:
    needs: [approval, abi-compat, changelog]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      pull-requests: read
      checks: read
      statuses: write
    steps:
      - name: Decide and publish the gate status
        # TODO: pin back to @main once this action is on main.
        uses: awslabs/aws-crt-builder/.github/actions/pre-merge-gate@feat/pre-merge-checks
        with:
          needs: ${{ toJSON(needs) }}
          abi-result: ${{ needs['abi-compat'].result }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          status-context: ${{ inputs.status-context }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
