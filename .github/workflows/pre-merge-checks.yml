# Everything that must be true before a pull request merges, in one workflow.
#
# Internal and external pull requests take the same path. The only difference is
# that an external one waits for a maintainer to add the approval label before the
# credentialed jobs start, and a push removes the label again.
#
# How it runs. GitHub schedules jobs as a graph: a job with no `needs` starts at
# once, and a job waits only for the jobs it names. So declare real dependencies and
# nothing more, and everything independent runs in parallel.
#
#   plan        decides what this event runs (a few seconds)
#   abi         credentialed; needs plan
#   changelog   no credentials; starts immediately
#   verdict     needs every check, is the only job that writes labels, and posts the
#               `pre-merge/gate` commit status the ruleset requires
#
# Adding a check:
#   1. Add a job. Credentialed ones add `needs: plan` and
#      `if: ${{ needs.plan.outputs.run_credentialed == 'true' }}`; the others need nothing.
#      A check that builds on another adds that job to its own `needs`.
#   2. Add its name to `verdict.needs`. The verdict fails if any needed job failed or
#      was cancelled; a check that needs more than pass/fail exposes outputs for it.
#
# Caller (pull_request_target runs from the default branch, so keep it thin):
#
#   on:
#     pull_request_target:
#       types: [opened, reopened, synchronize, edited, labeled, unlabeled]
#   concurrency:
#     group: pre-merge-${{ github.event.pull_request.number }}
#   jobs:
#     pre-merge:
#       permissions:
#         contents: read
#         pull-requests: write
#         id-token: write
#         statuses: write
#       uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@main
#       with:
#         lib-name: aws-c-common
#         approval-label: ci-ready
#       secrets:
#         CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}
name: Pre-merge checks

on:
  workflow_call:
    inputs:
      lib-name:
        description: 'C library name for the ABI check, e.g. aws-c-common.'
        required: true
        type: string
      approval-label:
        description: >-
          Label a maintainer adds to let a fork pull request run the credentialed
          checks. A push removes it. '' disables the gate.
        required: false
        type: string
        default: ''
      gate-same-repo:
        description: 'Apply the approval label to same-repo pull requests too (for testing the gate).'
        required: false
        type: boolean
        default: false
      runs-on:
        required: false
        type: string
        default: 'ubuntu-24.04'
    secrets:
      CRT_CI_ROLE_ARN:
        required: false

jobs:
  # Decides what this event runs. The ABI check runs on a code change, or for a gated
  # pull request when its approval label is added; a retitle or a label swap never
  # recomputes it, so a maintainer's override stands.
  plan:
    if: ${{ !(github.event.action == 'edited' && github.event.changes.title == null && github.event.changes.base == null) }}
    runs-on: ${{ inputs.runs-on }}
    permissions: {}
    outputs:
      skip: ${{ steps.p.outputs.skip }}
      gated: ${{ steps.p.outputs.gated }}
      code_changed: ${{ steps.p.outputs.code_changed }}
      run_credentialed: ${{ steps.p.outputs.run_credentialed }}
    steps:
      - name: Plan
        id: p
        env:
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          APPROVAL_LABEL: ${{ inputs.approval-label }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          GATE_SAME_REPO: ${{ inputs.gate-same-repo }}
          TITLE_CHANGED: ${{ github.event.changes.title != null }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        run: |
          set -euo pipefail
          CODE=false
          case "$ACTION" in
            opened|reopened|synchronize) CODE=true ;;
            edited) [[ "$BASE_CHANGED" == "true" ]] && CODE=true ;;
          esac
          # An edit that changes neither the title nor the base changes nothing checked.
          SKIP=false
          [[ "$ACTION" == "edited" && "$TITLE_CHANGED" != "true" && "$BASE_CHANGED" != "true" ]] && SKIP=true
          GATED=false
          [[ -n "$APPROVAL_LABEL" && ( "$FORK" == "true" || "$GATE_SAME_REPO" == "true" ) ]] && GATED=true
          RUN=false
          if [[ "$SKIP" != "true" ]]; then
            if [[ "$GATED" == "true" ]]; then
              [[ "$ACTION" == "labeled" && "$LABEL_NAME" == "$APPROVAL_LABEL" ]] && RUN=true
            else
              RUN=$CODE
            fi
          fi
          { echo "skip=$SKIP"; echo "gated=$GATED"; echo "code_changed=$CODE"; echo "run_credentialed=$RUN"; } >> "$GITHUB_OUTPUT"

  # Credentialed, and builds the PR's code.
  abi:
    needs: plan
    if: ${{ needs.plan.outputs.run_credentialed == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.check.outputs.label }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CRT_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Resolve the commits to compare
        id: refs
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          echo "base-sha=$(git merge-base HEAD "origin/${BASE_BRANCH}")" >> "$GITHUB_OUTPUT"

      - name: Check ABI
        id: check
        uses: awslabs/aws-crt-builder/.github/actions/check-abi@main
        with:
          lib-name: ${{ inputs.lib-name }}
          builder-version: latest
          base-ref: ${{ steps.refs.outputs.base-sha }}

  # No credentials and no PR code: it reads the fragment and the changed paths
  # through the API. Starts immediately.
  changelog:
    if: ${{ !(github.event.action == 'edited' && github.event.changes.title == null && github.event.changes.base == null) }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Read the fragment and changed paths at the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/changes/preview"
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/.changes/preview/${PR}.json?ref=${HEAD_SHA}" \
               -H 'Accept: application/vnd.github.raw' > "${RUNNER_TEMP}/changes/preview/${PR}.json" 2>/dev/null; then
            rm -f "${RUNNER_TEMP}/changes/preview/${PR}.json"
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" \
            --jq '.[] | (select(.filename | startswith(".changes/")) | "\(.status)\t\(.filename)"), (select((.previous_filename // "") | startswith(".changes/")) | "removed\t\(.previous_filename)")' \
            > "${RUNNER_TEMP}/changed-paths.tsv"

      - name: Check the PR title and the fragment
        uses: awslabs/aws-crt-builder/.github/actions/changelog@main
        with:
          mode: check
          changes-dir: ${{ runner.temp }}/changes
          changed-paths-file: ${{ runner.temp }}/changed-paths.tsv

  # The only job that writes labels. Always runs, from the results of the checks.
  verdict:
    needs: [plan, abi, changelog]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TITLE: ${{ github.event.pull_request.title }}
      APPROVAL_LABEL: ${{ inputs.approval-label }}
      GATED: ${{ needs.plan.outputs.gated }}
      CODE_CHANGED: ${{ needs.plan.outputs.code_changed }}
    steps:
      - name: Plan the label changes
        id: plan
        run: |
          set -uo pipefail
          ABI_RESULT="$(jq -r '.abi.result' <<< "$RESULTS")"
          ABI_LABEL="$(jq -r '.abi.outputs.label // ""' <<< "$RESULTS")"
          # A fresh verdict replaces the labels; a code change without one clears them.
          if [[ "$ABI_RESULT" == "success" && -n "$ABI_LABEL" ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"; echo "verdict=${ABI_LABEL}" >> "$GITHUB_OUTPUT"
          elif [[ "$CODE_CHANGED" == "true" ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"; echo "verdict=" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace the verdict label
        if: ${{ steps.plan.outputs.apply == 'true' }}
        uses: awslabs/aws-crt-builder/.github/actions/validate-label@main
        with:
          verdict: ${{ steps.plan.outputs.verdict }}
          pr: ${{ github.event.pull_request.number }}

      - name: Withdraw the approval after a code change
        if: ${{ env.GATED == 'true' && env.CODE_CHANGED == 'true' }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$APPROVAL_LABEL" || true

      - name: Publish the gate status
        run: |
          set -uo pipefail
          shopt -s nocasematch
          FAILED="$(jq -r 'to_entries | map(select(.key != "plan" and (.value.result == "failure" or .value.result == "cancelled"))) | map(.key + "=" + .value.result) | join(", ")' <<< "$RESULTS")"
          if [[ -n "$FAILED" ]]; then
            STATE=failure; REASON="pre-merge check(s) did not pass: ${FAILED}"
          elif ! LABELS="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name')"; then
            STATE=failure; REASON="could not read the labels on #${PR}"
          elif [[ "$GATED" == "true" ]] && ! grep -qxF "$APPROVAL_LABEL" <<< "$LABELS"; then
            STATE=failure; REASON="waiting for a maintainer to add the ${APPROVAL_LABEL} label"
          elif [[ "$TITLE" =~ ^chore(\([^\)]+\))?!?: ]] && grep -qxE 'minor|needs-review' <<< "$LABELS"; then
            STATE=failure; REASON="titled chore but the ABI check found a possible break: retitle it change, feat or fix and add a fragment"
          elif grep -qxF needs-review <<< "$LABELS"; then
            STATE=failure; REASON="labeled needs-review: a maintainer must REPLACE it with patch or minor; deleting it leaves this blocked"
          elif ! grep -qxE 'patch|minor' <<< "$LABELS"; then
            if [[ "$GATED" == "true" ]]; then
              STATE=failure; REASON="${APPROVAL_LABEL} is set but the ABI check has no verdict for this commit: remove and re-add ${APPROVAL_LABEL}"
            else
              STATE=failure; REASON="no patch or minor label: the ABI check has not produced a verdict for this commit"
            fi
          else
            STATE=success; REASON="all pre-merge checks passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "state=${STATE}" -f "context=pre-merge/gate" -f "description=${REASON:0:140}" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          [[ "$STATE" == "success" ]] || { echo "::error::${REASON}"; exit 1; }
