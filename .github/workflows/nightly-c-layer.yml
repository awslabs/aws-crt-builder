name: Nightly - C layer

on:
  # TODO: Remove push trigger before merging to main
  push:
    branches:
      - 'add-nightly-builds'
  schedule:
    - cron: '17 9 * * *' # 9:17 UTC daily (2:17 AM PDT, avoid top-of-hour congestion)
  workflow_dispatch: # Allow manual trigger

# Per-repo tests for each C library individually.
# The builder checks out each repo and its dependencies from main.
#
# TODO: Add pin/override support for when a dependency's main is broken.

env:
  BUILDER_VERSION: latest
  BUILDER_SOURCE: releases
  BUILDER_HOST: https://d19elf31gohf1l.cloudfront.net
  LINUX_BASE_IMAGE: ubuntu-22-x64
  RUN: ${{ github.run_id }}-${{ github.run_number }}
  CRT_CI_ROLE: ${{ secrets.CRT_CI_ROLE_ARN }}
  AWS_DEFAULT_REGION: us-east-1

permissions:
  id-token: write

jobs:
  tests-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - aws-c-common
          - aws-c-io
          - aws-c-cal
          - aws-c-compression
          - aws-c-http
          - aws-c-mqtt
          - aws-c-auth
          - aws-c-s3
          - aws-c-event-stream
          - aws-c-sdkutils
          - aws-c-iot
          - aws-checksums
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Build and test ${{ matrix.package }}
      run: |
        aws s3 cp s3://aws-crt-test-stuff/ci/${{ env.BUILDER_VERSION }}/linux-container-ci.sh ./linux-container-ci.sh && chmod a+x ./linux-container-ci.sh
        ./linux-container-ci.sh ${{ env.BUILDER_VERSION }} aws-crt-${{ env.LINUX_BASE_IMAGE }} build -p ${{ matrix.package }}

  tests-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        package:
          - aws-c-common
          - aws-c-io
          - aws-c-cal
          - aws-c-compression
          - aws-c-http
          - aws-c-mqtt
          - aws-c-auth
          - aws-c-s3
          - aws-c-event-stream
          - aws-c-sdkutils
          - aws-c-iot
          - aws-checksums
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Build and test ${{ matrix.package }}
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -c "from urllib.request import urlretrieve; urlretrieve('${{ env.BUILDER_HOST }}/${{ env.BUILDER_SOURCE }}/${{ env.BUILDER_VERSION }}/builder.pyz?run=${{ env.RUN }}', 'builder')"
        chmod a+x builder
        ./builder build -p ${{ matrix.package }}

  tests-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        package:
          - aws-c-common
          - aws-c-io
          - aws-c-cal
          - aws-c-compression
          - aws-c-http
          - aws-c-mqtt
          - aws-c-auth
          - aws-c-s3
          - aws-c-event-stream
          - aws-c-sdkutils
          - aws-c-iot
          - aws-checksums
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Build and test ${{ matrix.package }}
      run: |
        python -c "from urllib.request import urlretrieve; urlretrieve('${{ env.BUILDER_HOST }}/${{ env.BUILDER_SOURCE }}/${{ env.BUILDER_VERSION }}/builder.pyz?run=${{ env.RUN }}', 'builder.pyz')"
        python builder.pyz build -p ${{ matrix.package }}

  # Sanitizers: each repo tested with ASan+UBSan, TSan, and MSan individually.
  # MSan requires the special instrumented-libc++ image and toolchain file.
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - aws-c-common
          - aws-c-io
          - aws-c-cal
          - aws-c-compression
          - aws-c-http
          - aws-c-mqtt
          - aws-c-auth
          - aws-c-s3
          - aws-c-event-stream
          - aws-c-sdkutils
          - aws-c-iot
          - aws-checksums
        config:
          - { sanitizers: ",address,undefined", image: "ubuntu-22-x64", compiler: "clang-19", extra_args: "" }
          - { sanitizers: ",thread", image: "ubuntu-22-x64", compiler: "clang-19", extra_args: "" }
          - { sanitizers: "memory", image: "ubuntu-22-msan-x64", compiler: "clang-19", extra_args: "--cmake-extra=-DCMAKE_TOOLCHAIN_FILE=/opt/msan-toolchain.cmake" }
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Build and test ${{ matrix.package }} (${{ matrix.config.sanitizers }})
      run: |
        aws s3 cp s3://aws-crt-test-stuff/ci/${{ env.BUILDER_VERSION }}/linux-container-ci.sh ./linux-container-ci.sh && chmod a+x ./linux-container-ci.sh
        ./linux-container-ci.sh ${{ env.BUILDER_VERSION }} aws-crt-${{ matrix.config.image }} build -p ${{ matrix.package }} --compiler=${{ matrix.config.compiler }} --cmake-extra=-DENABLE_SANITIZERS=ON --cmake-extra=-DSANITIZERS="${{ matrix.config.sanitizers }}" ${{ matrix.config.extra_args }}
