name: Create Channel

on:
  workflow_call:
    secrets:
      AWS_S3_BUCKET: 
        required: true
      CRT_CI_ROLE_ARN:
        required: true
      AWS_ECR_REPO: 
        required: true

env:
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  CRT_CI_ROLE: ${{ secrets.CRT_CI_ROLE_ARN }}
  AWS_DEFAULT_REGION: us-east-1

permissions:
  id-token: write # This is required for requesting the JWT

# nothing
jobs:
  check-channel-name:
    name: Reject reserved channel name
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Get release tag
      uses: ./.github/actions/release-tag
      id: tag

    - name: Fail if channel name is reserved
      env:
        RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
      run: |
        if [ "$RELEASE_TAG" == "latest" ]; then
          echo "::error::'latest' is reserved for releases and cannot be used as a channel name (branch name)." >&2
          exit 1
        fi

  package:
    name: Package builder app
    needs: check-channel-name
    runs-on: ubuntu-24.04

    steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Get release tag
      uses: ./.github/actions/release-tag
      id: tag

    - name: Package builder to S3
      run: |
        export CHANNEL=${{ steps.tag.outputs.release_tag }}
        mkdir -p build
        mkdir -p staging
        cp -r builder staging/.
        python3 -m zipapp --python="/usr/bin/env python3" -m "builder.main:main" --output=build/builder staging
        aws s3 cp build/builder s3://$AWS_S3_BUCKET/channels/$CHANNEL/builder.pyz

    - name: Upload container CI script
      run: aws s3 cp ./.github/workflows/linux-container-ci.sh s3://aws-crt-test-stuff/ci/${{ steps.tag.outputs.release_tag }}/linux-container-ci.sh

  standard-images:
    # Channel build: only the channel-named tag, no :latest, no S3 export.
    needs: check-channel-name
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
