name: Nightly - aws-crt-cpp

on:
  # TODO: Remove push trigger before merging to main
  push:
    branches:
      - 'add-nightly-builds'
  schedule:
    - cron: '17 9 * * *' # 9:17 UTC daily (2:17 AM PDT, avoid top-of-hour congestion)
  workflow_dispatch: # Allow manual trigger

env:
  BUILDER_VERSION: latest
  BUILDER_SOURCE: releases
  BUILDER_HOST: https://d19elf31gohf1l.cloudfront.net
  PACKAGE_NAME: aws-crt-cpp
  LINUX_BASE_IMAGE: ubuntu-22-x64
  RUN: ${{ github.run_id }}-${{ github.run_number }}
  CRT_CI_ROLE: ${{ secrets.CRT_CI_ROLE_ARN }}
  AWS_DEFAULT_REGION: us-east-1
  NIGHTLY_CMAKE_ARGS: --cmake-extra=-DENFORCE_SUBMODULE_VERSIONS=OFF

permissions:
  id-token: write

jobs:
  linux-compiler-compat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        compiler:
          - gcc-4.8
          - gcc-5
          - gcc-7
          - gcc-8
          - gcc-9
          - gcc-11
          - gcc-12
          - gcc-13
          - gcc-14
          - gcc-15
          - gcc-16
          - clang-6
          - clang-7
          - clang-8
          - clang-9
          - clang-10
          - clang-11
          - clang-12
          - clang-13
          - clang-14
          - clang-15
          - clang-16
          - clang-17
          - clang-18
          - clang-19
          - clang-20
          - clang-21
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep -E "^\s+$repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build ${{ env.PACKAGE_NAME }}
      run: |
        aws s3 cp s3://aws-crt-test-stuff/ci/${{ env.BUILDER_VERSION }}/linux-container-ci.sh ./linux-container-ci.sh && chmod a+x ./linux-container-ci.sh
        ./linux-container-ci.sh ${{ env.BUILDER_VERSION }} aws-crt-${{ env.LINUX_BASE_IMAGE }} build -p ${{ env.PACKAGE_NAME }} --compiler=${{ matrix.compiler }} ${{ env.NIGHTLY_CMAKE_ARGS }}

  linux-distro-compat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - fedora-34-x64
          - opensuse-leap
          - rhel8-x64
          - raspbian-bullseye
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep -E "^\s+$repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build ${{ env.PACKAGE_NAME }}
      run: |
        aws s3 cp s3://aws-crt-test-stuff/ci/${{ env.BUILDER_VERSION }}/linux-container-ci.sh ./linux-container-ci.sh && chmod a+x ./linux-container-ci.sh
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        ./linux-container-ci.sh ${{ env.BUILDER_VERSION }} aws-crt-${{ matrix.image }} build -p ${{ env.PACKAGE_NAME }} ${{ env.NIGHTLY_CMAKE_ARGS }}

  cmake-min-version:
    runs-on: ubuntu-24.04
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep -E "^\s+$repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Install CMake 3.10 (effective min due to s2n dependency)
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.10.3/cmake-3.10.3-Linux-x86_64.tar.gz
        tar xzf cmake-3.10.3-Linux-x86_64.tar.gz
        echo "$PWD/cmake-3.10.3-Linux-x86_64/bin" >> $GITHUB_PATH
    - name: Verify CMake version
      run: cmake --version
    - name: Build with CMake 3.10
      run: |
        mkdir build && cd build
        cmake .. -DBUILD_DEPS=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENFORCE_SUBMODULE_VERSIONS=OFF
        cmake --build .
    - name: Test
      run: |
        cd build
        ctest --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizers: [",thread", ",address,undefined"]
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep -E "^\s+$repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build ${{ env.PACKAGE_NAME }} with sanitizers
      run: |
        aws s3 cp s3://aws-crt-test-stuff/ci/${{ env.BUILDER_VERSION }}/linux-container-ci.sh ./linux-container-ci.sh && chmod a+x ./linux-container-ci.sh
        ./linux-container-ci.sh ${{ env.BUILDER_VERSION }} aws-crt-${{ env.LINUX_BASE_IMAGE }} build -p ${{ env.PACKAGE_NAME }} --compiler=clang-17 --cmake-extra=-DENABLE_SANITIZERS=ON --cmake-extra=-DSANITIZERS="${{ matrix.sanitizers }}" ${{ env.NIGHTLY_CMAKE_ARGS }}

  clang-msan:
    runs-on: ubuntu-24.04
    env:
      MSAN_COMPILER: clang-19
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep -E "^\s+$repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build ${{ env.PACKAGE_NAME }} with MSan
      run: |
        aws s3 cp s3://aws-crt-test-stuff/ci/${{ env.BUILDER_VERSION }}/linux-container-ci.sh ./linux-container-ci.sh && chmod a+x ./linux-container-ci.sh
        ./linux-container-ci.sh ${{ env.BUILDER_VERSION }} aws-crt-ubuntu-22-msan-x64 build -p ${{ env.PACKAGE_NAME }} --compiler=${{ env.MSAN_COMPILER }} --cmake-extra=-DENABLE_SANITIZERS=ON --cmake-extra=-DSANITIZERS=memory --cmake-extra=-DCMAKE_TOOLCHAIN_FILE=/opt/msan-toolchain.cmake ${{ env.NIGHTLY_CMAKE_ARGS }}

  # Integration: build + test aws-crt-cpp on all 3 platforms
  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep -E "^\s+$repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build and test ${{ env.PACKAGE_NAME }}
      run: |
        aws s3 cp s3://aws-crt-test-stuff/ci/${{ env.BUILDER_VERSION }}/linux-container-ci.sh ./linux-container-ci.sh && chmod a+x ./linux-container-ci.sh
        ./linux-container-ci.sh ${{ env.BUILDER_VERSION }} aws-crt-${{ env.LINUX_BASE_IMAGE }} build -p ${{ env.PACKAGE_NAME }} ${{ env.NIGHTLY_CMAKE_ARGS }}

  macos:
    runs-on: macos-14
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep -E "^\s+$repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build and test ${{ env.PACKAGE_NAME }}
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -c "from urllib.request import urlretrieve; urlretrieve('${{ env.BUILDER_HOST }}/${{ env.BUILDER_SOURCE }}/${{ env.BUILDER_VERSION }}/builder.pyz?run=${{ env.RUN }}', 'builder')"
        chmod a+x builder
        ./builder build -p ${{ env.PACKAGE_NAME }} ${{ env.NIGHTLY_CMAKE_ARGS }}

  windows:
    runs-on: windows-2025
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      shell: bash
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep -E "^\s+$repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build and test ${{ env.PACKAGE_NAME }}
      run: |
        python -c "from urllib.request import urlretrieve; urlretrieve('${{ env.BUILDER_HOST }}/${{ env.BUILDER_SOURCE }}/${{ env.BUILDER_VERSION }}/builder.pyz?run=${{ env.RUN }}', 'builder.pyz')"
        python builder.pyz build -p ${{ env.PACKAGE_NAME }} ${{ env.NIGHTLY_CMAKE_ARGS }}
