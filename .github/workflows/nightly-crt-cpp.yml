name: Nightly - aws-crt-cpp

on:
  # TODO: Remove push trigger before merging to main
  push:
    branches:
      - 'add-nightly-builds'
  schedule:
    - cron: '17 9 * * *' # 9:17 UTC daily (2:17 AM PDT, avoid top-of-hour congestion)
  workflow_dispatch: # Allow manual trigger

# Integration tests for the C++ binding layer.
# Builds and tests aws-crt-cpp against C-layer main on all 3 platforms.
# C-layer compiler compat, sanitizers, and per-repo tests live in nightly-c-layer.yml.

env:
  BUILDER_VERSION: v0.9.97
  BUILDER_SOURCE: releases
  BUILDER_HOST: https://d19elf31gohf1l.cloudfront.net
  PACKAGE_NAME: aws-crt-cpp
  LINUX_BASE_IMAGE: ubuntu-18-x64
  RUN: ${{ github.run_id }}-${{ github.run_number }}
  CRT_CI_ROLE: ${{ secrets.CRT_CI_ROLE_ARN }}
  AWS_DEFAULT_REGION: us-east-1
  NIGHTLY_CMAKE_ARGS: --cmake-extra=-DENFORCE_SUBMODULE_VERSIONS=OFF

permissions:
  id-token: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep "^  $repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build and test ${{ env.PACKAGE_NAME }}
      run: |
        aws s3 cp s3://aws-crt-test-stuff/ci/${{ env.BUILDER_VERSION }}/linux-container-ci.sh ./linux-container-ci.sh && chmod a+x ./linux-container-ci.sh
        ./linux-container-ci.sh ${{ env.BUILDER_VERSION }} aws-crt-${{ env.LINUX_BASE_IMAGE }} build -p ${{ env.PACKAGE_NAME }} ${{ env.NIGHTLY_CMAKE_ARGS }}

  macos:
    runs-on: macos-14
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep "^  $repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build and test ${{ env.PACKAGE_NAME }}
      run: |
        python3 -c "from urllib.request import urlretrieve; urlretrieve('${{ env.BUILDER_HOST }}/${{ env.BUILDER_SOURCE }}/${{ env.BUILDER_VERSION }}/builder.pyz?run=${{ env.RUN }}', 'builder')"
        chmod a+x builder
        ./builder build -p ${{ env.PACKAGE_NAME }} ${{ env.NIGHTLY_CMAKE_ARGS }}

  windows:
    runs-on: windows-2025
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CRT_CI_ROLE }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}
    - name: Checkout aws-crt-cpp
      uses: actions/checkout@v4
      with:
        repository: awslabs/aws-crt-cpp
        submodules: true
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _builder
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false
    - name: Update submodules to main or pinned commit
      shell: bash
      run: |
        PINS_FILE="_builder/.github/nightly-pins.yml"
        for dir in crt/aws-c-* crt/aws-checksums; do
          repo=$(basename "$dir")
          pin=$(grep "^  $repo:" "$PINS_FILE" 2>/dev/null | awk '{print $2}' || true)
          if [ -n "$pin" ]; then
            echo "PINNED: $dir -> $pin"
            (cd "$dir" && git fetch origin && git checkout "$pin")
          else
            echo "Updating $dir to main..."
            (cd "$dir" && git fetch origin main && git checkout origin/main)
          fi
        done
    - name: Build and test ${{ env.PACKAGE_NAME }}
      run: |
        python -c "from urllib.request import urlretrieve; urlretrieve('${{ env.BUILDER_HOST }}/${{ env.BUILDER_SOURCE }}/${{ env.BUILDER_VERSION }}/builder.pyz?run=${{ env.RUN }}', 'builder.pyz')"
        python builder.pyz build -p ${{ env.PACKAGE_NAME }} ${{ env.NIGHTLY_CMAKE_ARGS }}
