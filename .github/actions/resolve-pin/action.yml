name: Resolve nightly pin
description: >
  Resolves commit pins from .github/nightly-pins.yml. Supports two modes:
  - Single package: set 'package' input, get 'branch_arg' output for the builder.
  - Submodules: set 'submodule-dirs' input (glob), updates submodules in-place.

inputs:
  package:
    description: "Single package name to look up. Outputs branch_arg for the builder."
    required: false
  submodule-dirs:
    description: "Glob pattern for submodule directories to update (e.g. 'crt/aws-c-* crt/aws-checksums')."
    required: false

outputs:
  branch_arg:
    description: "'-b <sha>' if pinned, empty otherwise. Only set when 'package' input is used."
    value: ${{ steps.pin.outputs.branch_arg }}

runs:
  using: composite
  steps:
    - name: Checkout pins file
      uses: actions/checkout@v4
      with:
        path: _pins
        sparse-checkout: .github/nightly-pins.yml
        sparse-checkout-cone-mode: false

    - name: Resolve pins
      id: pin
      shell: bash
      run: |
        SCRIPT="${GITHUB_ACTION_PATH}/scripts/resolve-pin.sh"
        PINS_FILE="_pins/.github/nightly-pins.yml"

        if [ -n "${{ inputs.package }}" ]; then
          "$SCRIPT" "$PINS_FILE" --package "${{ inputs.package }}"
        fi

        if [ -n "${{ inputs.submodule-dirs }}" ]; then
          # shellcheck disable=SC2086 -- intentional word splitting on glob
          "$SCRIPT" "$PINS_FILE" --submodule-dirs ${{ inputs.submodule-dirs }}
        fi
