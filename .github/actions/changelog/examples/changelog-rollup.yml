# Cut a release: move .changes/preview/ into the new version's directory and
# regenerate CHANGELOG.md, in one commit on the default branch.
#
# Reference wiring. The release job should ideally fold these file changes into
# its own `chore(release)` commit rather than push a second one.

name: Changelog rollup
on:
  workflow_call:
    inputs:
      version:
        description: 'New release version, x.y.z'
        required: true
        type: string
      date:
        description: 'Release date, ISO-8601 YYYY-MM-DD'
        required: true
        type: string
      highlights:
        description: 'Optional one-line highlights for the release header'
        required: false
        type: string
        default: ''
      bump:
        description: >-
          Optional cross-check: patch | minor | major. The version decides;
          a value that disagrees with it fails the release.
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  rollup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: awslabs/aws-crt-builder/.github/actions/changelog@main
        with:
          mode: rollup
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          highlights: ${{ inputs.highlights }}
          bump: ${{ inputs.bump }}

      - name: Commit the release notes
        # Values reach the shell as env vars; interpolating them into the body
        # would be an injection vector.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "aws-sdk-common-runtime-bot"
          git config user.email "aws-sdk-common-runtime@amazon.com"
          git add .changes CHANGELOG.md
          git commit -m "chore(release): changelog for ${VERSION}"
          git push
