# Replay every merge on the docs branch so docs mirrors main. If the
# merge added or modified a preview fragment, also regenerate CHANGELOG.md
# and fold it into the same docs commit — one commit on docs per merge on
# main. Main stays clean of bot commits.

name: Changelog Render
on:
  push:
    branches: [main]

concurrency:
  group: changelog-docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.CHANGELOG_DEPLOY_KEY }}

      # The render script lives in aws-crt-builder, not in this repo.
      - uses: actions/checkout@v4
        with:
          repository: awslabs/aws-crt-builder
          ref: main
          path: .crt-builder

      - name: Replay merge onto docs, refresh preview
        env:
          TRIGGER_SHA: ${{ github.sha }}
          DOCS_BRANCH: docs
          CHANGELOG_PY: ${{ github.workspace }}/.crt-builder/.github/actions/changelog/scripts/changelog.py
        run: |
          set -euo pipefail

          git config user.name  "aws-sdk-common-runtime-bot"
          git config user.email "aws-sdk-common-runtime@amazon.com"

          # Ensure docs exists locally, tracking origin's copy if remote has it.
          if git ls-remote --exit-code --heads origin "${DOCS_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${DOCS_BRANCH}:${DOCS_BRANCH}"
            git checkout "${DOCS_BRANCH}"
          else
            # First run: branch docs from main's parent of TRIGGER_SHA so the
            # first cherry-pick is meaningful (it introduces the changes).
            PARENT=$(git rev-parse "${TRIGGER_SHA}^")
            git checkout -B "${DOCS_BRANCH}" "${PARENT}"
          fi

          # -Xno-renames stops a rollup's preview/->latest/ moves being seen
          # as renames of a fresh fragment.
          if ! git cherry-pick -x --allow-empty \
                 --strategy=recursive -Xno-renames "${TRIGGER_SHA}"; then
            UNMERGED=$(git diff --name-only --diff-filter=U | sort -u)
            if [[ "$UNMERGED" == "CHANGELOG.md" ]]; then
              # Derived file; the render below rewrites it regardless.
              echo "Auto-resolving CHANGELOG.md conflict (derived file)."
              git checkout --theirs CHANGELOG.md
              git add CHANGELOG.md
              GIT_EDITOR=true git cherry-pick --continue
            else
              echo "ERROR: cherry-pick conflict in: ${UNMERGED:-<none>}" >&2
              echo "       Manual intervention required." >&2
              git cherry-pick --abort || true
              exit 1
            fi
          fi

          # Unconditional: a no-op render stages nothing and amends nothing.
          python3 "${CHANGELOG_PY}" render
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          git push origin "${DOCS_BRANCH}"
