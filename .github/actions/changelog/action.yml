name: 'Changelog'
description: 'Check a pull request''s changelog fragment, seed a template for one, or roll fragments up into a release. Fragments are author-written; no bot ever writes one on the author''s behalf.'

inputs:
  mode:
    description: 'One of: check | seed | render | rollup'
    required: true
  changes-dir:
    description: 'Directory holding fragments.'
    required: false
    default: '.changes'
  changelog:
    description: 'Path to CHANGELOG.md (render and rollup modes).'
    required: false
    default: 'CHANGELOG.md'
  # check, seed
  pr:
    description: 'Pull request number.'
    required: false
  title:
    description: >-
      PR title. In check mode the change type is derived from it, which decides
      whether a fragment is required at all; in seed mode it seeds the type,
      falling back to chore.
    required: false
  # check
  changed-paths-file:
    description: >-
      File of `status<TAB>path` lines for the pull request's changed files. When
      given, a customer-visible change must add exactly one new fragment at
      exactly its own path.
    required: false
    default: ''
  changes-prefix:
    description: 'Repo-relative changes directory, for matching changed paths.'
    required: false
    default: '.changes'
  bot-author:
    description: >-
      Login of the PR author when it is a bot. Non-empty waives both the title
      convention and the fragment requirement.
    required: false
    default: ''
  # seed
  out:
    description: >-
      Where to write the template. Keep it outside the changes directory: it is a
      starting point for the author, not a fragment the pull request committed.
    required: false
    default: ''
  # rollup
  version:
    description: 'Release version, x.y.z.'
    required: false
  date:
    description: 'Release date, ISO-8601.'
    required: false
  minor-prs:
    description: >-
      Comma-separated pull requests carrying the `minor` label. Their
      entries render under "Possible Breaking Changes" instead of their own
      type section. The caller looks the labels up; this action takes no token.
    required: false
    default: ''
  docs-branch:
    description: 'Branch named in the release file''s pointer to in-flight changes.'
    required: false
    default: 'docs'

outputs:
  rc:
    description: 'check mode: 0 pass, 1 author-fixable, 2 caller error.'
    value: ${{ steps.run.outputs.rc }}
  reason:
    description: >-
      check mode: ok | exempt-type | waived-bot | missing-fragment |
      invalid-fragment | pr-mismatch | type-mismatch | bad-title |
      stray-fragment | modified-fragment. Empty when the caller's own inputs are
      wrong (rc 2), since no check ran.
    value: ${{ steps.run.outputs.reason }}

runs:
  using: 'composite'
  steps:
    - name: Run changelog tool
      id: run
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CHANGES_DIR: ${{ inputs.changes-dir }}
        CHANGELOG: ${{ inputs.changelog }}
        PR: ${{ inputs.pr }}
        TITLE: ${{ inputs.title }}
        BOT_AUTHOR: ${{ inputs.bot-author }}
        CHANGED_PATHS_FILE: ${{ inputs.changed-paths-file }}
        CHANGES_PREFIX: ${{ inputs.changes-prefix }}
        OUT: ${{ inputs.out }}
        VERSION: ${{ inputs.version }}
        DATE: ${{ inputs.date }}
        MINOR_PRS: ${{ inputs.minor-prs }}
        DOCS_BRANCH: ${{ inputs.docs-branch }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
