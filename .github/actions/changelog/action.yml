name: 'Changelog'
description: 'Automated changelog: validate/check fragments on PR, render on merge (serialized), rollup on release. Fragments are author-created via scripts/new-change; no bot ever writes on the author''s behalf.'

inputs:
  mode:
    description: 'One of: check | seed | render | rollup | revert | validate | list'
    required: true
  changes-dir:
    description: 'Directory holding fragments.'
    required: false
    default: '.changes'
  changelog:
    description: 'Path to CHANGELOG.md.'
    required: false
    default: 'CHANGELOG.md'
  # check
  pr:
    description: 'PR number (check mode).'
    required: false
  # seed
  title:
    description: >-
      PR title. In check mode the change type is derived from it, which decides
      whether a fragment is required at all; in seed mode it seeds the type,
      falling back to chore.
    required: false
  bot-author:
    description: >-
      Login of the PR author when it is a bot (check mode). Non-empty waives
      both the title convention and the fragment requirement.
    required: false
    default: ''
  out:
    description: 'Write the seeded fragment here instead of <changes-dir>/preview/<pr>.json (seed mode).'
    required: false
    default: ''
  # revert
  original-pr:
    description: 'Original PR number being reverted (revert mode).'
    required: false
  revert-pr:
    description: 'PR number of the revert PR (revert mode).'
    required: false
  url:
    description: 'PR URL (revert mode).'
    required: false
  # rollup
  version:
    description: 'Release version, x.y.z (rollup mode).'
    required: false
  date:
    description: 'Release date, ISO-8601 (rollup mode).'
    required: false
  highlights:
    description: 'One-line highlights string for the release header (rollup mode).'
    required: false
    default: ''
  bump:
    description: 'Optional: patch | minor | major. Inferred from version + current latest/ if omitted.'
    required: false
    default: ''

outputs:
  rc:
    description: 'check mode: 0 pass, 1 author-fixable, 2 caller error.'
    value: ${{ steps.run.outputs.rc }}
  reason:
    description: >-
      check mode: ok | exempt-type | waived-bot | missing-fragment |
      invalid-fragment | pr-mismatch | type-mismatch | bad-title.
    value: ${{ steps.run.outputs.reason }}

runs:
  using: 'composite'
  steps:
    - name: Run changelog tool
      id: run
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CHANGES_DIR: ${{ inputs.changes-dir }}
        CHANGELOG: ${{ inputs.changelog }}
        PR: ${{ inputs.pr }}
        TITLE: ${{ inputs.title }}
        BOT_AUTHOR: ${{ inputs.bot-author }}
        OUT: ${{ inputs.out }}
        ORIGINAL_PR: ${{ inputs.original-pr }}
        REVERT_PR: ${{ inputs.revert-pr }}
        URL: ${{ inputs.url }}
        VERSION: ${{ inputs.version }}
        DATE: ${{ inputs.date }}
        HIGHLIGHTS: ${{ inputs.highlights }}
        BUMP: ${{ inputs.bump }}
      run: |
        set -euo pipefail
        SCRIPT="${GITHUB_ACTION_PATH}/scripts/changelog.py"
        case "${MODE}" in
          check)
            # Does not fail the step. The caller reads `rc` and `reason` and
            # decides -- a missing fragment gets a template comment first,
            # every other failure only gets the diagnostic above.
            # TITLE and BOT_AUTHOR stay env vars; interpolating a PR title into
            # the command line would be a shell-injection vector.
            OUT="$(mktemp)"
            set +e
            python3 "${SCRIPT}" check --pr "${PR}" --title "${TITLE}" \
              --bot-author "${BOT_AUTHOR}" --changes-dir "${CHANGES_DIR}" | tee "${OUT}"
            rc="${PIPESTATUS[0]}"
            set -e
            REASON="$(grep -o 'CHANGELOG_CHECK_REASON::[a-z-]*' "${OUT}" | tail -n1 | cut -d: -f3 || true)"
            rm -f "${OUT}"
            {
              echo "rc=${rc}"
              echo "reason=${REASON}"
            } >> "${GITHUB_OUTPUT}"
            ;;
          seed)
            # --url is shared with revert mode below; both mean "the PR's URL".
            EXTRA=()
            if [[ -n "${OUT}" ]]; then EXTRA+=(--out "${OUT}"); fi
            # TITLE stays an env var: interpolating it into the command line
            # would be a shell-injection vector.
            python3 "${SCRIPT}" seed --pr "${PR}" --title "${TITLE}" \
              --url "${URL}" --changes-dir "${CHANGES_DIR}" "${EXTRA[@]}"
            ;;
          validate)
            python3 "${SCRIPT}" validate "${CHANGES_DIR}/preview"
            ;;
          render)
            python3 "${SCRIPT}" render \
              --changes-dir "${CHANGES_DIR}" --changelog "${CHANGELOG}"
            ;;
          rollup)
            EXTRA=()
            if [[ -n "${BUMP}" ]]; then EXTRA+=(--bump "${BUMP}"); fi
            python3 "${SCRIPT}" rollup \
              --version "${VERSION}" --date "${DATE}" --highlights "${HIGHLIGHTS}" \
              --changes-dir "${CHANGES_DIR}" --changelog "${CHANGELOG}" \
              "${EXTRA[@]}"
            ;;
          revert)
            python3 "${SCRIPT}" revert \
              --original-pr "${ORIGINAL_PR}" --revert-pr "${REVERT_PR}" \
              --url "${URL}" \
              --changes-dir "${CHANGES_DIR}"
            ;;
          list)
            python3 "${SCRIPT}" list --changes-dir "${CHANGES_DIR}"
            ;;
          *)
            echo "ERROR: unknown mode '${MODE}'" >&2; exit 2 ;;
        esac
