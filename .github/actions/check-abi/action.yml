name: 'Check ABI Compliance'
description: 'Dump and compare the ABI of a C shared library between the PR head and its base ref, and label the PR patch/minor/needs-review'

inputs:
  lib-name:
    description: 'Library name (e.g. aws-c-s3). Determines the .so filename (libaws-c-s3.so).'
    required: true
  builder-version:
    description: 'Builder version/channel used to build the library and its dependencies. Also the tag of the ABI docker image.'
    required: false
    default: 'v0.9.93'
  builder-source:
    description: 'Builder artifact source prefix (releases for tagged versions, channels for branch builds).'
    required: false
    default: 'releases'
  builder-host:
    description: 'Builder artifact host URL.'
    required: false
    default: 'https://d19elf31gohf1l.cloudfront.net'
  image-registry:
    description: 'ECR registry hosting the aws-crt-ubuntu-22-abi-x64 image.'
    required: false
    default: '123124136734.dkr.ecr.us-east-1.amazonaws.com'
  image-name:
    description: 'ABI docker image name (baked with the abi-compliance-checker toolchain).'
    required: false
    default: 'aws-crt-ubuntu-22-abi-x64'
  github-token:
    description: 'Token used to label the PR. Needs pull-requests: write. Defaults to the job token.'
    required: false
    default: ${{ github.token }}
  patch-label:
    description: 'Label applied when the ABI is backward-compatible.'
    required: false
    default: 'patch'
  minor-label:
    description: 'Label applied when the ABI changed (an incompatible but valid, semver-minor, change).'
    required: false
    default: 'minor'
  needs-review-label:
    description: 'Label applied when source (API) compatibility is broken -- callers fail to recompile. Always applied regardless of the binary-compatibility result, since a compile break is never just a routine minor bump.'
    required: false
    default: 'needs-review'
  base-ref:
    description: 'Explicit base ref to diff against (e.g. a previous release tag), overriding the PR base ref. Set this only from a non-PR caller (e.g. a release workflow comparing "previous tag vs current ref"); PR workflows must leave this empty so the PR base ref is used and the PR gets labeled.'
    required: false
    default: ''

outputs:
  label:
    description: 'ABI verdict: patch | minor | needs-review. Empty if no verdict was produced (the run failed first).'
    value: ${{ steps.run_check.outputs.label }}

runs:
  using: 'composite'
  steps:
    # The ABI toolchain (abi-compliance-checker, abi-dumper, ctags, cmake) is
    # baked into the aws-crt-ubuntu-22-abi-x64 image, so there is no per-run
    # apt-get install here. The consumer job must have configured AWS creds with
    # ECR pull access (aws-actions/configure-aws-credentials) and checked out
    # with fetch-depth: 0 before invoking this action.
    - name: Pull ABI image
      shell: bash
      env:
        IMAGE_REGISTRY: ${{ inputs.image-registry }}
        IMAGE_NAME: ${{ inputs.image-name }}
        BUILDER_VERSION: ${{ inputs.builder-version }}
      run: |
        aws ecr get-login-password | docker login "$IMAGE_REGISTRY" -u AWS --password-stdin
        DOCKER_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${BUILDER_VERSION}"
        docker pull "$DOCKER_IMAGE"
        printf 'ABI_DOCKER_IMAGE=%s\n' "$DOCKER_IMAGE" >> "$GITHUB_ENV"

    - name: Run ABI check in container
      # Runs build -> dump -> compare -> report -> gate as one in-container
      # process (they chain state through an in-container GITHUB_ENV). Any
      # real verdict (patch/minor/needs-review) is a passing run; only a tool
      # error (no verdict produced) fails the job.
      #
      # The verdict escapes via stdout: gate.sh prints a marker line
      # ("ABI_LABEL_RESULT::<label>") that we grep out of the captured
      # `docker run` output below, since a host-mounted file would be owned by
      # the runner's UID and the container's different UID can't write to it.
      id: run_check
      shell: bash
      env:
        # printf/env-block (not raw template interpolation) prevents shell and
        # newline injection through the lib-name input.
        LIB_NAME: ${{ inputs.lib-name }}
        BUILDER_VERSION: ${{ inputs.builder-version }}
        BUILDER_SOURCE: ${{ inputs.builder-source }}
        BUILDER_HOST: ${{ inputs.builder-host }}
        ABI_BASE_REF: ${{ inputs.base-ref }}
        ABI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        # Mount the checkout at the same path so GITHUB_WORKSPACE resolves inside
        # the container, and mount the step-summary file so report.py can append
        # the verdict to the host job summary.
        #
        # GITHUB_ACTION_PATH (our own scripts) is read-only; nothing in the
        # container writes there. GITHUB_WORKSPACE stays read-write: build.sh
        # runs `git worktree add` (writes under $GITHUB_WORKSPACE/.git/worktrees/)
        # and installs the head build into $GITHUB_WORKSPACE/build/.
        SUMMARY_MOUNT=()
        SUMMARY_ENV=()
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          SUMMARY_MOUNT=(-v "${GITHUB_STEP_SUMMARY}:${GITHUB_STEP_SUMMARY}")
          SUMMARY_ENV=(--env "GITHUB_STEP_SUMMARY=${GITHUB_STEP_SUMMARY}")
        fi

        # tee streams the log live and captures it in OUT for parsing below.
        # PIPESTATUS[0] is docker's exit code, not tee's.
        OUT="$(mktemp)"
        # -e would abort here before RC is read, so guard the pipeline.
        set +e
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -v "${GITHUB_ACTION_PATH}:/opt/check-abi:ro" \
          "${SUMMARY_MOUNT[@]}" \
          --env "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}" \
          --env "GITHUB_BASE_REF=${GITHUB_BASE_REF:-}" \
          --env "GITHUB_HEAD_REF=${GITHUB_HEAD_REF:-}" \
          --env "ABI_BASE_REF=${ABI_BASE_REF:-}" \
          --env "ABI_DEFAULT_BRANCH=${ABI_DEFAULT_BRANCH:-}" \
          --env "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}" \
          --env "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER:-}" \
          --env "ABI_LIB_NAME=${LIB_NAME}" \
          --env "BUILDER_VERSION=${BUILDER_VERSION}" \
          --env "BUILDER_SOURCE=${BUILDER_SOURCE}" \
          --env "BUILDER_HOST=${BUILDER_HOST}" \
          "${SUMMARY_ENV[@]}" \
          --entrypoint bash \
          "${ABI_DOCKER_IMAGE}" \
          /opt/check-abi/scripts/abi_check.sh | tee "$OUT"
        RC="${PIPESTATUS[0]}"
        set -e

        # grep exits 1 when there is no verdict, which -e would treat as fatal.
        LABEL="$(grep -o 'ABI_LABEL_RESULT::[a-zA-Z0-9_-]*' "$OUT" | tail -n1 | cut -d: -f3 || true)"
        rm -f "$OUT"
        if [[ -n "$LABEL" ]]; then
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
        fi
        echo "rc=${RC}" >> "$GITHUB_OUTPUT"

    - name: Upload ABI artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: abi-artifacts-${{ github.event.pull_request.number || github.run_id }}
        path: ${{ github.workspace }}/abi-artifacts
        if-no-files-found: ignore
        retention-days: 7

    - name: Label PR
      # Clears the three verdict labels, then applies the current one.
      # Requires pull-requests: write.
      if: ${{ inputs.base-ref == '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_FROM_EVENT: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REPO: ${{ github.repository }}
        PATCH_LABEL: ${{ inputs.patch-label }}
        MINOR_LABEL: ${{ inputs.minor-label }}
        NEEDS_REVIEW_LABEL: ${{ inputs.needs-review-label }}
        LABEL: ${{ steps.run_check.outputs.label }}
        RUN_RC: ${{ steps.run_check.outputs.rc }}
      run: |
        PR_NUMBER="${PR_FROM_EVENT:-}"
        if [[ -z "$PR_NUMBER" ]]; then
          # Push runs carry no pull_request object; find the PR whose head is
          # this commit. --search matches any PR containing the commit, so the
          # jq filter narrows to the one where it is the head.
          MATCHES="$(gh pr list --repo "$REPO" --state open --search "$HEAD_SHA" --limit 10 \
              --json number,headRefOid,baseRefName \
              | jq -r --arg sha "$HEAD_SHA" --arg base "${DEFAULT_BRANCH:-main}" \
                  '[.[] | select(.headRefOid == $sha and .baseRefName == $base)]
                   | map(.number) | join(" ")')"
          COUNT="$(wc -w <<< "$MATCHES")"
          if [[ "$COUNT" -eq 0 ]]; then
            echo "No open PR into '${DEFAULT_BRANCH}' with head ${HEAD_SHA}; skipping labeling."
            exit 0
          fi
          if [[ "$COUNT" -gt 1 ]]; then
            echo "PRs ${MATCHES} all have head ${HEAD_SHA}; ambiguous, skipping labeling."
            exit 0
          fi
          PR_NUMBER="$MATCHES"
        fi
        ALL_LABELS=("$PATCH_LABEL" "$MINOR_LABEL" "$NEEDS_REVIEW_LABEL")
        # Translate gate.sh's fixed verdict token ("patch"/"minor"/"needs-review")
        # to the configured label name, since gate.sh has no access to these inputs.
        TARGET=""
        if [[ "${RUN_RC:-1}" == "0" && -n "${LABEL:-}" ]]; then
          case "$LABEL" in
            patch) TARGET="$PATCH_LABEL" ;;
            minor) TARGET="$MINOR_LABEL" ;;
            needs-review) TARGET="$NEEDS_REVIEW_LABEL" ;;
            *) echo "Unexpected ABI verdict token '$LABEL'; treating as no verdict." ;;
          esac
        fi

        CURRENT="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels -q '.labels[].name')"
        DROP=()
        for l in "${ALL_LABELS[@]}"; do
          [[ "$l" == "$TARGET" ]] && continue
          grep -qxF "$l" <<< "$CURRENT" && DROP+=("$l")
        done
        ADD=""
        if [[ -n "$TARGET" ]] && ! grep -qxF "$TARGET" <<< "$CURRENT"; then
          ADD="$TARGET"
        fi

        if [[ -z "$ADD" && "${#DROP[@]}" -eq 0 ]]; then
          echo "Labels on #${PR_NUMBER} already correct (${TARGET:-none}); nothing to do."
          exit 0
        fi

        EDIT=()
        if [[ -n "$ADD" ]]; then
          # gh pr edit --add-label fails if the label does not exist in the repo.
          case "$ADD" in
            "$PATCH_LABEL") COLOR=0e8a16; DESC="ABI backward-compatible (patch release)" ;;
            "$MINOR_LABEL") COLOR=fbca04; DESC="ABI changed, source-compatible (minor release)" ;;
            *)              COLOR=d93f0b; DESC="ABI check: source/API compatibility broken, needs manual review" ;;
          esac
          gh label create "$ADD" --repo "$REPO" --color "$COLOR" --description "$DESC" --force 2>/dev/null || true
          EDIT+=(--add-label "$ADD")
        fi
        if [[ "${#DROP[@]}" -gt 0 ]]; then
          EDIT+=(--remove-label "$(IFS=,; echo "${DROP[*]}")")
        fi
        echo "Updating #${PR_NUMBER}: add='${ADD:-none}' remove='${DROP[*]:-none}'"
        gh pr edit "$PR_NUMBER" --repo "$REPO" "${EDIT[@]}" \
          || echo "WARNING: could not update labels (token may be read-only on fork PRs)."

    - name: Fail if the ABI check failed
      if: ${{ steps.run_check.outputs.rc != '0' }}
      shell: bash
      run: |
        echo "::error::ABI check exited ${{ steps.run_check.outputs.rc }}."
        exit 1
